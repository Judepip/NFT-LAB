<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAB NFT · Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СБРОС ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #12182b;
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --glass-bg: rgba(18, 24, 43, 0.65);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-primary: #e8f0f8;
            --text-secondary: #8899bb;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                repeating-linear-gradient(60deg, transparent, transparent 40px, rgba(0,255,136,0.02) 40px, rgba(0,255,136,0.02) 41px),
                repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(0,212,255,0.02) 40px, rgba(0,212,255,0.02) 41px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: 8px 12px 8px 12px;
            backdrop-filter: blur(2px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px 14px 6px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        .balance {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--neon-green);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .balance span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 10px 0 10px 0;
            padding: 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
            min-height: 0;
        }
        .content::-webkit-scrollbar {
            width: 3px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }

        .screen {
            display: none;
            animation: fadeSlide 0.25s ease-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* ----- ИНВЕНТАРЬ (NFT-подарки) ----- */
        .nft-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .nft-item {
            aspect-ratio: 1/1;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0,255,136,0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            padding: 4px;
        }
        .nft-item::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.05), transparent, rgba(0,212,255,0.05), transparent);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        .nft-item .nft-icon {
            font-size: 36px;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.4));
        }
        .nft-item .nft-image {
            width: 64px;
            height: 64px;
            object-fit: contain;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.3));
        }
        .nft-item .nft-name {
            z-index: 1;
            margin-top: 4px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 10px;
            text-align: center;
        }
        .nft-item .nft-rarity {
            z-index: 1;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0,255,136,0.15);
            color: var(--neon-green);
            margin-top: 2px;
        }
        .empty-inventory {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        /* ----- НОВАЯ ГОРИЗОНТАЛЬНАЯ РУЛЕТКА (10 ЯЧЕЕК) ----- */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .roulette-track {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            padding: 8px 0;
        }

        .roulette-slider {
            display: flex;
            gap: 8px;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.15, 1);
            padding: 0 8px;
            will-change: transform;
        }

        .roulette-cell {
            flex: 0 0 calc(20% - 8px); /* 5 ячеек видно на экране, 10 всего */
            min-width: 60px;
            aspect-ratio: 3/4;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,255,136,0.03);
        }

        .roulette-cell img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.2));
            margin-bottom: 4px;
        }

        .roulette-cell .cell-name {
            font-size: 9px;
            font-weight: 500;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .roulette-cell .cell-rarity {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(0,255,136,0.1);
            color: var(--neon-green);
            margin-top: 2px;
        }

        .roulette-cell.empty {
            opacity: 0.5;
            border-color: rgba(255,255,255,0.1);
        }

        .roulette-cell.highlight {
            border-color: var(--neon-green);
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
            transform: scale(1.02);
        }

        .roulette-indicator {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: calc(100% + 4px);
            background: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            border-radius: 2px;
            z-index: 5;
            pointer-events: none;
        }

        .roulette-btn {
            background: var(--neon-green);
            color: #0a0e1a;
            border: none;
            border-radius: 30px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 18px;
            font-family: var(--font-mono);
            width: 100%;
            max-width: 280px;
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
            transition: 0.15s;
            cursor: pointer;
            margin-top: 8px;
        }
        .roulette-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .roulette-btn:disabled {
            opacity: 0.4;
            transform: scale(1);
            pointer-events: none;
        }

        .roulette-result {
            text-align: center;
            font-size: 14px;
            min-height: 24px;
            color: var(--neon-cyan);
            margin-top: 4px;
        }

        .roulette-hint {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 2px;
        }

        /* ----- АПГРЕЙД ----- */
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .upgrade-item:last-child { border-bottom: none; }
        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .upgrade-info .title {
            font-weight: 500;
        }
        .upgrade-info .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .upgrade-level {
            font-size: 13px;
            color: var(--neon-cyan);
            background: rgba(0,212,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .upgrade-cost {
            font-size: 12px;
            color: var(--neon-green);
            margin-right: 12px;
        }
        .upgrade-btn {
            background: rgba(0,255,136,0.12);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 18px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .upgrade-btn:active { transform: scale(0.94); }
        .upgrade-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* ----- ПРОФИЛЬ ----- */
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-box .value {
            font-size: 22px;
            font-weight: 600;
            color: var(--neon-green);
        }
        .stat-box .label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ----- НАВИГАЦИЯ ----- */
        .nav-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
            padding: 6px 0 4px 0;
        }
        .nav-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
            padding: 4px 0 8px 0;
        }
        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 4px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.15s;
            cursor: pointer;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn .icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-btn:active { transform: scale(0.94); }
        .nav-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0,255,136,0.08);
            background: rgba(0,255,136,0.05);
        }

        @media (max-width: 380px) {
            .header h1 { font-size: 15px; }
            .balance { font-size: 12px; padding: 4px 12px; }
            .nav-btn { font-size: 11px; padding: 10px 2px; }
            .nav-btn .icon { font-size: 17px; }
            .roulette-cell { flex: 0 0 calc(25% - 8px); min-width: 50px; }
            .roulette-cell img { width: 36px; height: 36px; }
            .roulette-cell .cell-name { font-size: 8px; }
        }

        @media (min-width: 600px) {
            .roulette-cell { flex: 0 0 calc(16.66% - 8px); }
        }
        @media (min-width: 900px) {
            .roulette-cell { flex: 0 0 calc(12.5% - 8px); }
        }

        .nft-item .glow-pulse {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(0,255,136,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .nft-item:hover .glow-pulse { opacity: 1; }
    </style>
</head>
<body>
<div id="app">

    <!-- ВЕРХНИЙ БАР -->
    <div class="header">
        <h1>🧪 LAB NFT</h1>
        <div class="balance">
            <span>⚡</span> <span id="balanceDisplay">1,000.0</span> <span>GIFT</span>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ -->
    <div class="content" id="contentArea">

        <!-- ЭКРАН: ИНВЕНТАРЬ -->
        <div class="screen active" id="screenInventory">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span style="font-weight:500;">📦 NFT-подарки</span>
                    <span style="color:var(--text-secondary);font-size:12px;" id="nftCount">0 шт.</span>
                </div>
                <div class="nft-grid" id="inventoryGrid">
                    <!-- заполняется JS -->
                </div>
            </div>
        </div>

        <!-- ЭКРАН: РУЛЕТКА (ГОРИЗОНТАЛЬНАЯ) -->
        <div class="screen" id="screenRoulette">
            <div class="glass-card">
                <div class="roulette-container">
                    <!-- Трек с ячейками -->
                    <div class="roulette-track">
                        <div class="roulette-indicator"></div>
                        <div class="roulette-slider" id="rouletteSlider">
                            <!-- Ячейки заполняются из JS -->
                        </div>
                    </div>

                    <!-- Результат -->
                    <div id="rouletteResult" class="roulette-result">Нажмите "РАСКРУТИТЬ"</div>
                    
                    <!-- Кнопка запуска (фиксированная цена 150) -->
                    <button class="roulette-btn" id="spinBtn">РАСКРУТИТЬ ЗА 150</button>
                    
                    <!-- Подсказка -->
                    <div class="roulette-hint">⚡ ДВОЙНОЙ ТАП ДЛЯ БЫСТРОГО КРУЧЕНИЯ</div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН: АПГРЕЙД -->
        <div class="screen" id="screenUpgrade">
            <div class="glass-card">
                <div style="margin-bottom:10px; font-weight:500;">🔧 Улучшения лаборатории</div>
                <div id="upgradeList">
                    <!-- заполняется JS -->
                </div>
            </div>
        </div>

        <!-- ЭКРАН: ПРОФИЛЬ -->
        <div class="screen" id="screenProfile">
            <div class="glass-card" style="text-align:center;">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div style="font-size:18px; font-weight:600;" id="profileName">Аноним</div>
                <div style="color:var(--text-secondary); font-size:13px;" id="profileId">ID: 0</div>
                <div class="profile-stats">
                    <div class="stat-box"><div class="value" id="statNFT">0</div><div class="label">NFT</div></div>
                    <div class="stat-box"><div class="value" id="statLevel">1</div><div class="label">Уровень</div></div>
                    <div class="stat-box"><div class="value" id="statSpins">0</div><div class="label">Спинов</div></div>
                    <div class="stat-box"><div class="value" id="statUpgrades">0</div><div class="label">Апгрейдов</div></div>
                </div>
            </div>
        </div>

    </div>

    <!-- ЦЕНТРАЛЬНЫЕ КНОПКИ -->
    <div class="nav-center">
        <div class="nav-btn active" data-screen="screenInventory">
            <span class="icon">📦</span> ИНВЕНТАРЬ
        </div>
        <div class="nav-btn" data-screen="screenRoulette">
            <span class="icon">🎰</span> РУЛЕТКА
        </div>
        <div class="nav-btn" data-screen="screenUpgrade">
            <span class="icon">🔧</span> АПГРЕЙД
        </div>
    </div>

    <!-- НИЖНИЕ КНОПКИ -->
    <div class="nav-bottom">
        <div class="nav-btn" data-screen="screenProfile">
            <span class="icon">👤</span> ПРОФИЛЬ
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ---------- 1. TELEGRAM SDK (БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ) ----------
        let tg = null;
        let isTelegram = false;

        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                isTelegram = true;
            } else {
                console.warn('Telegram WebApp не обнаружен. Работа в режиме эмуляции.');
                tg = {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                };
            }
        } catch (e) {
            console.error('Ошибка инициализации Telegram:', e);
            tg = {
                ready: () => {},
                expand: () => {},
                showAlert: (msg) => alert(msg),
                sendData: (data) => console.log('Telegram sendData:', data),
                initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
            };
        }

        // ---------- 2. СПИСОК ПОДАРКОВ (10 ШТУК) ----------
        const GIFTS = [
            { name: 'Bow Tie', rarity: 'редкий', image: 'images/BowTie.png' },
            { name: 'Chill Flame', rarity: 'эпик', image: 'images/ChillFlame.png' },
            { name: 'Big Year', rarity: 'легенд', image: 'images/BigYear.png' },
            { name: 'Snake Box', rarity: 'обычный', image: 'images/SnakeBox.png' },
            { name: 'Liberty Figure', rarity: 'легенд', image: 'images/LibertyFigure.png' },
            { name: 'Light Sword', rarity: 'эпик', image: 'images/LightSword.png' },
            { name: 'Star Notepad', rarity: 'редкий', image: 'images/StarNotepad.png' },
            { name: 'Кубок', rarity: 'легенд', image: 'images/Кубок.png' },
            { name: 'Кольцо', rarity: 'эпик', image: 'images/Кольцо.png' },
            { name: 'Мишка', rarity: 'обычный', image: 'images/Мишка.png' },
        ];

        // ---------- 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ ----------
        const STORAGE_KEY = 'lab_nft_state';

        function getDefaultState() {
            return {
                balance: 1000.0,
                user: tg.initDataUnsafe?.user || { id: 0, first_name: 'Аноним' },
                inventory: [],
                upgrades: [
                    { id: 'up1', name: 'Генератор GIFT', desc: '+5 GIFT/час', level: 0, cost: 150, maxLvl: 5 },
                    { id: 'up2', name: 'Сканер редкости', desc: 'Шанс NFT +3%', level: 0, cost: 200, maxLvl: 4 },
                    { id: 'up3', name: 'Ускоритель спина', desc: 'Спин стоит -2 GIFT', level: 0, cost: 100, maxLvl: 6 },
                ],
                spins: 0,
                level: 1,
                upgradeCount: 0,
                isSpinning: false,
            };
        }

        let state;

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                state = parsed;
                if (tg.initDataUnsafe?.user) {
                    state.user = tg.initDataUnsafe.user;
                }
                console.log('Состояние загружено из localStorage');
            } else {
                state = getDefaultState();
                console.log('Создано новое состояние');
            }
        } catch (e) {
            console.warn('Ошибка загрузки состояния:', e);
            state = getDefaultState();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Ошибка сохранения состояния:', e);
            }
        }

        // ---------- 4. DOM-ССЫЛКИ ----------
        const $ = (id) => document.getElementById(id);
        const balanceDisplay = $('balanceDisplay');
        const nftCount = $('nftCount');
        const screens = document.querySelectorAll('.screen');
        const navBtns = document.querySelectorAll('.nav-btn');
        const inventoryGrid = $('inventoryGrid');
        const upgradeList = $('upgradeList');
        const rouletteSlider = $('rouletteSlider');
        const spinBtn = $('spinBtn');
        const rouletteResult = $('rouletteResult');

        const profileName = $('profileName');
        const profileId = $('profileId');
        const statNFT = $('statNFT');
        const statLevel = $('statLevel');
        const statSpins = $('statSpins');
        const statUpgrades = $('statUpgrades');

        // ---------- 5. ФУНКЦИЯ СОЗДАНИЯ ЯЧЕЕК РУЛЕТКИ ----------
        function renderRouletteCells(highlightIndex = -1) {
            // Создаём массив ячеек: 10 подарков + 2 пустых для объёма
            const cells = [];
            
            // Добавляем 2 пустых ячейки в начало
            for (let i = 0; i < 2; i++) {
                cells.push({ name: '❌ Пусто', rarity: '', image: '', empty: true });
            }
            
            // Добавляем все подарки
            GIFTS.forEach(g => {
                cells.push({ ...g, empty: false });
            });
            
            // Добавляем 2 пустых ячейки в конец
            for (let i = 0; i < 2; i++) {
                cells.push({ name: '❌ Пусто', rarity: '', image: '', empty: true });
            }

            // Рендерим ячейки
            rouletteSlider.innerHTML = cells.map((cell, index) => {
                const isHighlight = (index === highlightIndex);
                const emptyClass = cell.empty ? ' empty' : '';
                const highlightClass = isHighlight ? ' highlight' : '';
                
                let content = '';
                if (cell.image && !cell.empty) {
                    content = `
                        <img src="${cell.image}" alt="${cell.name}" loading="lazy">
                        <div class="cell-name">${cell.name}</div>
                        <div class="cell-rarity">${cell.rarity}</div>
                    `;
                } else if (cell.empty) {
                    content = `
                        <div style="font-size:24px; opacity:0.3;">❌</div>
                        <div class="cell-name" style="opacity:0.3;">Пусто</div>
                    `;
                } else {
                    content = `
                        <div style="font-size:28px;">🎁</div>
                        <div class="cell-name">${cell.name}</div>
                        <div class="cell-rarity">${cell.rarity}</div>
                    `;
                }
                
                return `<div class="roulette-cell${emptyClass}${highlightClass}">${content}</div>`;
            }).join('');
        }

        // ---------- 6. ФУНКЦИЯ ОБНОВЛЕНИЯ UI ----------
        function render() {
            balanceDisplay.textContent = state.balance.toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            nftCount.textContent = state.inventory.length + ' шт.';

            // Инвентарь
            if (state.inventory.length === 0) {
                inventoryGrid.innerHTML = `<div class="empty-inventory">🧪 Нет подарков. Крутите рулетку!</div>`;
            } else {
                inventoryGrid.innerHTML = state.inventory.map(item => {
                    const iconHtml = item.image 
                        ? `<img class="nft-image" src="${item.image}" alt="${item.name}">` 
                        : `<div class="nft-icon">🎁</div>`;
                    return `
                        <div class="nft-item" data-id="${item.id}">
                            <div class="glow-pulse"></div>
                            ${iconHtml}
                            <div class="nft-name">${item.name}</div>
                            <div class="nft-rarity">${item.rarity || 'обычный'}</div>
                        </div>
                    `;
                }).join('');
            }

            // Апгрейды
            upgradeList.innerHTML = state.upgrades.map(u => {
                const isMax = u.level >= u.maxLvl;
                const canAfford = state.balance >= u.cost && !isMax;
                return `
                    <div class="upgrade-item" data-id="${u.id}">
                        <div class="upgrade-info">
                            <div class="title">${u.name}</div>
                            <div class="desc">${u.desc}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="upgrade-level">Ур.${u.level}/${u.maxLvl}</span>
                            <span class="upgrade-cost">${isMax ? 'MAX' : u.cost + ' GIFT'}</span>
                            <button class="upgrade-btn" data-id="${u.id}" ${!canAfford ? 'disabled' : ''}>
                                ${isMax ? '✔' : '↑'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Профиль
            profileName.textContent = state.user.first_name || 'Аноним';
            profileId.textContent = `ID: ${state.user.id || 0}`;
            statNFT.textContent = state.inventory.length;
            statLevel.textContent = state.level;
            statSpins.textContent = state.spins;
            statUpgrades.textContent = state.upgradeCount;

            // Рендерим ячейки рулетки (без подсветки)
            renderRouletteCells();

            saveState();
        }
