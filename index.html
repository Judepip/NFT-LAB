<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>NFT Рулетка в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== Глобальные стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b0b1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ===== Основной контент ===== */
        .app-container {
            flex: 1;
            padding: 16px 16px 80px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* ===== Страницы ===== */
        .page {
            display: none;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.3s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== Хедер ===== */
        .gr-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .gr-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gr-header p {
            color: #8899bb;
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* ===== Рулетка (ваш код) ===== */
        .gr-reel-wrap {
            position: relative;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        
        .gr-reel {
            position: relative;
            border-radius: 24px;
            background: linear-gradient(145deg, #14142a, #1a1a35);
            padding: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        
        .gr-reel__ambient {
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, #f7971e33, #ffd20033);
            filter: blur(12px);
            z-index: 0;
        }
        .gr-reel__ambient span {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 26px;
            background: conic-gradient(from 0deg, #f7971e22, #ffd20022, #f7971e22);
            animation: rotateGlow 8s linear infinite;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        
        .gr-reel__glow {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(ellipse at 50% 30%, #ffd20011 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }
        
        .gr-reel__frame {
            position: relative;
            border-radius: 18px;
            background: #0b0b1a;
            overflow: hidden;
            z-index: 2;
            padding: 4px 0;
        }
        
        .gr-reel__frame-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(255,210,0,0.03) 60%, transparent 80%);
            pointer-events: none;
            z-index: 5;
        }
        
        .gr-reel__viewport {
            position: relative;
            overflow: hidden;
            height: 340px;
            mask-image: linear-gradient(to bottom, transparent 2%, black 12%, black 88%, transparent 98%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 2%, black 12%, black 88%, transparent 98%);
        }
        
        .gr-reel__marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 60px;
            background: linear-gradient(to bottom, #f7971e, #ffd200);
            border-radius: 4px;
            box-shadow: 0 0 20px #ffd20066;
            z-index: 10;
            pointer-events: none;
        }
        
        .gr-reel__track {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 0;
            transition: transform 0.1s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .gr-reel__item {
            flex-shrink: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gr-reel__card {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: #1a1a35;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .gr-reel__card-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 3;
        }
        
        .gr-reel__card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .gr-reel__item.active .gr-reel__card {
            transform: scale(1.15);
            box-shadow: 0 0 30px #ffd20044, 0 0 60px #ffd20022;
            border: 2px solid #ffd200;
        }
        
        /* Кнопка SPIN */
        .gr-actions {
            margin-top: 24px;
            text-align: center;
        }
        
        .gr-spin {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 50px;
            padding: 14px 48px;
            font-size: 18px;
            font-weight: 700;
            color: #0b0b1a;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 6px 24px #ffd20044;
            width: 100%;
            max-width: 280px;
        }
        
        .gr-spin:active {
            transform: scale(0.95);
        }
        .gr-spin:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        .gr-hint {
            color: #667799;
            font-size: 13px;
            margin-top: 12px;
        }
        
        /* ===== Инвентарь ===== */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        
        .inventory-item {
            background: #14142a;
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #2a2a4a;
            transition: transform 0.2s;
        }
        .inventory-item img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 6px;
        }
        .inventory-item .name {
            font-size: 12px;
            font-weight: 600;
            color: #ccd;
        }
        .inventory-item .rarity {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .rarity-common { background: #2a4a3a; color: #8bc34a; }
        .rarity-rare { background: #3a3a6a; color: #64b5f6; }
        .rarity-epic { background: #4a2a6a; color: #ce93d8; }
        .rarity-legendary { background: #6a3a1a; color: #ffb74d; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #667799;
        }
        .empty-state .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        
        /* ===== Профиль ===== */
        .profile-card {
            background: #14142a;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid #2a2a4a;
            margin-top: 16px;
        }
        .profile-card .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }
        .profile-card .username {
            font-size: 20px;
            font-weight: 700;
        }
        .profile-card .userid {
            font-size: 13px;
            color: #667799;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #2a2a4a;
        }
        .profile-stats .stat {
            text-align: center;
        }
        .profile-stats .stat .value {
            font-size: 24px;
            font-weight: 700;
            color: #ffd200;
        }
        .profile-stats .stat .label {
            font-size: 12px;
            color: #667799;
        }
        
        /* ===== Нижняя навигация ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0b0b1a;
            border-top: 1px solid #1a1a35;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 100;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: #556688;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 16px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: inherit;
        }
        .nav-btn .icon {
            font-size: 24px;
        }
        .nav-btn.active {
            color: #ffd200;
        }
        .nav-btn:active {
            transform: scale(0.9);
        }
        
        /* ===== Адаптив ===== */
        @media (max-width: 400px) {
            .inventory-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- ===== СТРАНИЦА: РУЛЕТКА ===== -->
    <div id="page-roulette" class="page active">
        <header class="gr-header">
            <h1>🎰 NFT Рулетка</h1>
            <p>Запустите розыгрыш и получите NFT-подарок</p>
        </header>
        
        <div class="gr-reel-wrap">
            <div class="gr-reel">
                <div class="gr-reel__ambient" aria-hidden="true">
                    <span></span>
                </div>
                <div class="gr-reel__glow" aria-hidden="true"></div>
                <div class="gr-reel__frame">
                    <div class="gr-reel__frame-shine" aria-hidden="true"></div>
                    <div class="gr-reel__viewport">
                        <div class="gr-reel__marker" aria-hidden="true"></div>
                        <div class="gr-reel__track" id="reelTrack">
                            <!-- Карточки будут вставлены JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="gr-actions">
            <button class="gr-spin" id="spinBtn">🎲 Запустить розыгрыш</button>
            <p class="gr-hint" id="balanceHint">💰 Спинов: 1 · NFT в инвентаре: 0</p>
        </div>
    </div>
    
    <!-- ===== СТРАНИЦА: ИНВЕНТАРЬ ===== -->
    <div id="page-inventory" class="page">
        <header class="gr-header">
            <h1>📦 Инвентарь</h1>
            <p>Ваши выигранные NFT-подарки</p>
        </header>
        <div id="inventoryContainer">
            <!-- Заполняется JS -->
        </div>
    </div>
    
    <!-- ===== СТРАНИЦА: ПРОФИЛЬ ===== -->
    <div id="page-profile" class="page">
        <header class="gr-header">
            <h1>👤 Профиль</h1>
            <p>Ваша статистика</p>
        </header>
        <div id="profileContainer">
            <!-- Заполняется JS -->
        </div>
    </div>
</div>

<!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
<nav class="bottom-nav">
    <button class="nav-btn active" data-page="roulette">
        <span class="icon">🎰</span>
        <span>Рулетка</span>
    </button>
    <button class="nav-btn" data-page="inventory">
        <span class="icon">📦</span>
        <span>Инвентарь</span>
    </button>
    <button class="nav-btn" data-page="profile">
        <span class="icon">👤</span>
        <span>Профиль</span>
    </button>
</nav>

<script>
    // ============================================
    // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
    // ============================================
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // ============================================
    // ДАННЫЕ
    // ============================================
    const NFT_LIST = [
        { id: 'hexpot', name: 'Hex Pot', image: 'https://nft.fragment.com/gift/hexpot-10348.medium.jpg', rarity: 'rare' },
        { id: 'plushpepe', name: 'Plush Pepe', image: 'https://nft.fragment.com/gift/plushpepe-2133.medium.jpg', rarity: 'common' },
        { id: 'easteregg', name: 'Easter Egg', image: 'https://nft.fragment.com/gift/easteregg-1.medium.jpg', rarity: 'epic' },
        { id: 'astralshard', name: 'Astral Shard', image: 'https://nft.fragment.com/gift/astralshard-2358.medium.jpg', rarity: 'legendary' },
        { id: 'deskcalendar', name: 'Desk Calendar', image: 'https://nft.fragment.com/gift/deskcalendar-100.medium.jpg', rarity: 'common' },
        { id: 'toybear', name: 'Toy Bear', image: 'https://nft.fragment.com/gift/toybear-500.medium.jpg', rarity: 'rare' },
    ];
    
    // Состояние пользователя (синхронизируется с ботом)
    let userState = {
        balance: 1,
        inventory: []
    };
    
    // ============================================
    // РУЛЕТКА (ваш код, адаптированный)
    // ============================================
    const track = document.getElementById('reelTrack');
    const spinBtn = document.getElementById('spinBtn');
    const balanceHint = document.getElementById('balanceHint');
    
    let isSpinning = false;
    let currentPosition = 0;
    const ITEM_HEIGHT = 88; // 80px + 8px gap
    
    // Создаем полосу с карточками (повторяем для бесконечности)
    function buildReel() {
        // Делаем 3 копии для бесконечной прокрутки
        const items = [...NFT_LIST, ...NFT_LIST, ...NFT_LIST];
        track.innerHTML = '';
        items.forEach((nft, index) => {
            const article = document.createElement('article');
            article.className = 'gr-reel__item';
            article.dataset.index = index;
            article.innerHTML = `
                <div class="gr-reel__card">
                    <div class="gr-reel__card-shine" aria-hidden="true"></div>
                    <img src="${nft.image}" alt="${nft.name}" draggable="false"/>
                </div>
            `;
            track.appendChild(article);
        });
    }
    buildReel();
    
    // Позиционирование
    function updateReel(position) {
        track.style.transform = `translate3d(0px, ${position}px, 0)`;
    }
    
    // Подсветка активного элемента
    function highlightActive() {
        const items = track.querySelectorAll('.gr-reel__item');
        const centerIndex = Math.round(Math.abs(currentPosition) / ITEM_HEIGHT);
        items.forEach((el, i) => {
            el.classList.toggle('active', i === centerIndex);
        });
    }
    
    // Прокрутка с анимацией (ваш алгоритм)
    function spinReel(callback) {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        
        // Случайный сдвиг (минимум 5 оборотов + случайное смещение)
        const extraSpins = 5 + Math.random() * 3;
        const targetIndex = Math.floor(Math.random() * NFT_LIST.length);
        const targetPos = -(extraSpins * NFT_LIST.length + targetIndex) * ITEM_HEIGHT;
        
        // Анимация
        const startPos = currentPosition;
        const duration = 3000 + Math.random() * 1000;
        const startTime = performance.now();
        
        function animate(time) {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // Easing: cubic-bezier(0.25, 0.1, 0.25, 1)
            const ease = 1 - Math.pow(1 - progress, 3);
            const pos = startPos + (targetPos - startPos) * ease;
            currentPosition = pos;
            updateReel(pos);
            highlightActive();
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                // Финальная позиция
                const finalItem = NFT_LIST[targetIndex];
                isSpinning = false;
                spinBtn.disabled = false;
                
                // Отправляем результат в бот
                tg.sendData(JSON.stringify({
                    action: 'spin',
                    win: finalItem
                }));
                
                // Симулируем обновление баланса (бот пришлет ответ)
                if (typeof callback === 'function') callback(finalItem);
            }
        }
        requestAnimationFrame(animate);
    }
    
    // Обновление UI после спина
    function onSpinComplete(winNft) {
        // Локально обновляем баланс и инвентарь (бот подтвердит)
        userState.balance -= 1;
        userState.inventory.push(winNft);
        updateUI();
    }
    
    // ============================================
    // ОБНОВЛЕНИЕ UI
    // ============================================
    function updateUI() {
        balanceHint.textContent = `💰 Спинов: ${userState.balance} · NFT в инвентаре: ${userState.inventory.length}`;
        renderInventory();
        renderProfile();
    }
    
    // ============================================
    // ИНВЕНТАРЬ
    // ============================================
    function renderInventory() {
        const container = document.getElementById('inventoryContainer');
        const inv = userState.inventory;
        
        if (inv.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">📭</span>
                    <p>У вас пока нет NFT-подарков.</p>
                    <p style="font-size:13px;margin-top:4px;">Запустите рулетку и выиграйте свой первый!</p>
                </div>
            `;
            return;
        }
        
        let html = '<div class="inventory-grid">';
        inv.forEach(item => {
            html += `
                <div class="inventory-item">
                    <img src="${item.image}" alt="${item.name}" loading="lazy"/>
                    <div class="name">${item.name}</div>
                    <span class="rarity rarity-${item.rarity}">${item.rarity}</span>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }
    
    // ============================================
    // ПРОФИЛЬ
    // ============================================
    function renderProfile() {
        const container = document.getElementById('profileContainer');
        const user = tg.initDataUnsafe?.user || { username: 'Аноним', id: '—' };
        
        container.innerHTML = `
            <div class="profile-card">
                <div class="avatar">🎮</div>
                <div class="username">${user.username || 'Аноним'}</div>
                <div class="userid">ID: ${user.id || '—'}</div>
                <div class="profile-stats">
                    <div class="stat">
                        <div class="value">${userState.balance}</div>
                        <div class="label">Спинов</div>
                    </div>
                    <div class="stat">
                        <div class="value">${userState.inventory.length}</div>
                        <div class="label">NFT</div>
                    </div>
                </div>
            </div>
        `;
    }
    
    // ============================================
    // НАВИГАЦИЯ
    // ============================================
    function navigateTo(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page-${page}`).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    }
    
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            navigateTo(btn.dataset.page);
            // При переходе на инвентарь или профиль обновляем данные
            if (btn.dataset.page === 'inventory' || btn.dataset.page === 'profile') {
                // Запрашиваем актуальные данные из бота
                tg.sendData(JSON.stringify({ action: btn.dataset.page === 'inventory' ? 'get_inventory' : 'get_profile' }));
            }
        });
    });
    
    // ============================================
    // СОБЫТИЯ
    // ============================================
    spinBtn.addEventListener('click', () => {
        if (userState.balance <= 0) {
            tg.HapticFeedback?.notificationOccurred('error');
            alert('У вас закончились спины!');
            return;
        }
        tg.HapticFeedback?.impactOccurred('medium');
        spinReel(onSpinComplete);
    });
    
    // ============================================
    // ПОЛУЧЕНИЕ ДАННЫХ ОТ БОТА (WebApp.sendData)
    // ============================================
    // Бот может отправлять данные через ответное сообщение,
    // но для синхронизации состояния мы используем sendData.
    // Бот присылает обновления в чат, мы их не видим здесь.
    // Поэтому пользователь видит результат в чате.
    
    // ============================================
    // СТАРТ
    // ============================================
    // Загружаем начальные данные (можно запросить у бота)
    tg.sendData(JSON.stringify({ action: 'get_profile' }));
    tg.sendData(JSON.stringify({ action: 'get_inventory' }));
    
    // Инициализация рулетки
    updateReel(currentPosition);
    highlightActive();
    updateUI();
    
    // ============================================
    // ДОПОЛНИТЕЛЬНО: Обработка входящих данных
    // ============================================
    // Telegram WebApp не поддерживает прямой обмен с ботом,
    // только отправка данных через sendData и ответ в чате.
    // Поэтому мы полагаемся на локальное состояние.
    // В реальном проекте используйте WebSocket или API.
    
    console.log('🎰 NFT Рулетка загружена!');
    console.log('👤 Пользователь:', tg.initDataUnsafe?.user || 'Неизвестно');
</script>

</body>
</html>
