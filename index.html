<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT LAB · Mini App</title>
    <script>
        if (!window.Telegram) {
            window.Telegram = {
                WebApp: {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                }
            };
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js" onerror="console.warn('Telegram SDK не загрузился, используется эмуляция')"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #12182b;
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --glass-bg: rgba(18, 24, 43, 0.65);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-primary: #e8f0f8;
            --text-secondary: #8899bb;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
            --gold: #ffd700;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                repeating-linear-gradient(60deg, transparent, transparent 40px, rgba(0, 255, 136, 0.02) 40px, rgba(0, 255, 136, 0.02) 41px),
                repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(0, 212, 255, 0.02) 40px, rgba(0, 212, 255, 0.02) 41px);
            pointer-events: none;
            z-index: 0;
        }
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: 8px 12px 8px 12px;
            backdrop-filter: blur(2px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px 14px 6px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .balance {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gold);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .balance span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 10px 0 10px 0;
            padding: 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
            min-height: 0;
        }
        .content::-webkit-scrollbar {
            width: 3px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }

        .screen {
            display: none;
            animation: fadeSlide 0.25s ease-out;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .nft-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .nft-item {
            aspect-ratio: 1/1;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            padding: 4px;
        }
        .nft-item::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 255, 136, 0.05), transparent, rgba(0, 212, 255, 0.05), transparent);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            100% {
                transform: rotate(360deg);
            }
        }
        .nft-item .nft-icon {
            font-size: 36px;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
        }
        .nft-item .nft-image {
            width: 64px;
            height: 64px;
            object-fit: contain;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.3));
        }
        .nft-item .nft-name {
            z-index: 1;
            margin-top: 4px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .empty-inventory {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        /* РУЛЕТКА - стили из второго файла */
        .gr-reel-wrap {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 0;
        }
        .gr-reel {
            position: relative;
            padding: 4px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0,255,136,0.1), rgba(0,212,255,0.1));
            box-shadow: 0 0 60px rgba(0,255,136,0.05);
        }
        .gr-reel__ambient {
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.2), transparent, rgba(0,212,255,0.2), transparent);
            animation: rotateGlow 8s linear infinite;
            pointer-events: none;
        }
        .gr-reel__glow {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at 50% 50%, rgba(0,255,136,0.03), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .gr-reel__frame {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: var(--bg-primary);
            z-index: 1;
            padding: 4px 0;
        }
        .gr-reel__frame-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 50%, rgba(255,255,255,0.01) 100%);
            pointer-events: none;
            z-index: 2;
        }
        .gr-reel__viewport {
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .gr-reel__marker {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: calc(100% + 4px);
            background: var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green), 0 0 60px rgba(0,255,136,0.3);
            z-index: 5;
            pointer-events: none;
        }
        .gr-reel__marker::before,
        .gr-reel__marker::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-green);
            left: 50%;
            transform: translateX(-50%);
        }
        .gr-reel__marker::before {
            top: -3px;
        }
        .gr-reel__marker::after {
            bottom: -3px;
        }
        .gr-reel__track {
            display: flex;
            gap: 8px;
            padding: 8px 4px;
            transition: transform 4.5s cubic-bezier(0.1, 0.6, 0.15, 1);
            will-change: transform;
        }
        .gr-reel__item {
            flex: 0 0 calc(20% - 8px);
            min-width: 60px;
            aspect-ratio: 3/4;
            list-style: none;
        }
        .gr-reel__card {
            position: relative;
            height: 100%;
            width: 100%;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.15);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0,255,136,0.02);
            padding: 4px;
        }
        .gr-reel__card img {
            width: 70%;
            height: 65%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0,255,136,0.1));
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .gr-reel__card .gift-name {
            font-size: 7px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
            margin-top: 2px;
            max-width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 0 2px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gr-reel__card-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%, rgba(255,255,255,0.02) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gr-reel__item.winning .gr-reel__card {
            border-color: var(--neon-green);
            box-shadow: 0 0 40px rgba(0,255,136,0.3), inset 0 0 40px rgba(0,255,136,0.05);
            transform: scale(1.05);
        }
        .gr-reel__item.winning .gr-reel__card img {
            filter: drop-shadow(0 0 30px rgba(0,255,136,0.4));
        }
        .gr-reel__item.winning .gr-reel__card-shine {
            opacity: 1;
        }

        .gr-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .gr-spin {
            background: var(--neon-green);
            color: #0a0e1a;
            border: none;
            border-radius: 30px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 18px;
            font-family: var(--font-mono);
            width: 100%;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
            transition: 0.15s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .gr-spin::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
            pointer-events: none;
        }
        .gr-spin:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .gr-spin:disabled {
            opacity: 0.4;
            transform: scale(1);
            pointer-events: none;
        }
        .gr-spin__label {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .gr-spin__label .cost {
            font-weight: 400;
            font-size: 14px;
            opacity: 0.7;
        }
        .gr-hint {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            opacity: 0.7;
            margin: 0;
        }
        .gr-result {
            text-align: center;
            font-size: 14px;
            min-height: 24px;
            color: var(--neon-cyan);
            font-weight: 500;
            padding: 4px 0;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-box .value {
            font-size: 22px;
            font-weight: 600;
            color: var(--gold);
        }
        .stat-box .label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
            padding: 6px 0 4px 0;
        }
        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 4px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.15s;
            cursor: pointer;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn .icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-btn:active {
            transform: scale(0.94);
        }
        .nav-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.08);
            background: rgba(0, 255, 136, 0.05);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
            padding: 20px;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-content {
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 2px solid var(--neon-green);
            border-radius: 24px;
            padding: 30px 24px 24px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.15);
            position: relative;
            overflow: hidden;
        }
        .modal-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 255, 136, 0.03), transparent, rgba(0, 212, 255, 0.03), transparent);
            animation: rotateGlow 8s linear infinite;
        }
        .modal-content .modal-gif {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 12px auto;
            display: block;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.3));
        }
        .modal-content .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
            margin-bottom: 4px;
        }
        .modal-content .modal-price {
            font-size: 16px;
            color: var(--gold);
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }
        .modal-actions .modal-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: 0.15s;
            flex: 1;
            min-width: 80px;
            max-width: 140px;
        }
        .modal-actions .modal-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }
        .modal-actions .btn-sell {
            background: var(--gold);
            color: #0a0e1a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .modal-actions .btn-inventory {
            background: var(--neon-cyan);
            color: #0a0e1a;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .modal-actions .btn-close {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
        }
        .modal-close-icon {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 22px;
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 2;
            transition: 0.15s;
            background: none;
            border: none;
            font-family: var(--font-mono);
        }
        .modal-close-icon:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        @media (max-width: 380px) {
            .header h1 {
                font-size: 15px;
            }
            .balance {
                font-size: 12px;
                padding: 4px 12px;
            }
            .nav-btn {
                font-size: 11px;
                padding: 10px 2px;
            }
            .nav-btn .icon {
                font-size: 17px;
            }
            .gr-reel__item {
                flex: 0 0 calc(25% - 8px);
                min-width: 50px;
            }
            .gr-reel__card img {
                width: 60%;
                height: 55%;
            }
            .gr-reel__card .gift-name {
                font-size: 6px;
            }
            .nft-item .nft-image {
                width: 48px;
                height: 48px;
            }
            .modal-content img {
                width: 100px;
                height: 100px;
            }
            .modal-actions {
                flex-direction: column;
                gap: 6px;
            }
            .modal-actions .modal-btn {
                max-width: 100%;
            }
            .gr-spin {
                font-size: 15px;
                padding: 12px 20px;
            }
        }
        @media (min-width: 600px) {
            .gr-reel__item {
                flex: 0 0 calc(16.66% - 8px);
            }
        }
        @media (min-width: 900px) {
            .gr-reel__item {
                flex: 0 0 calc(12.5% - 8px);
            }
        }
        .nft-item .glow-pulse {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(0, 255, 136, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .nft-item:hover .glow-pulse {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="app">

        <div class="header">
            <h1>🧪 LAB NFT</h1>
            <div class="balance">
                <span>⭐</span> <span id="balanceDisplay">1,000</span>
            </div>
        </div>

        <div class="content" id="contentArea">

            <div class="screen active" id="screenInventory">
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                        <span style="font-weight:500;">📦 NFT-подарки</span>
                        <span style="color:var(--text-secondary);font-size:12px;" id="nftCount">0 шт.</span>
                    </div>
                    <div class="nft-grid" id="inventoryGrid"></div>
                </div>
            </div>

            <div class="screen" id="screenRoulette">
                <div class="glass-card" style="padding: 12px;">
                    <div class="gr-reel-wrap">
                        <div class="gr-reel">
                            <div class="gr-reel__ambient" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <div class="gr-reel__glow" aria-hidden="true"></div>
                            <div class="gr-reel__frame">
                                <div class="gr-reel__frame-shine" aria-hidden="true"></div>
                                <div class="gr-reel__viewport">
                                    <div class="gr-reel__marker" aria-hidden="true"></div>
                                    <div class="gr-reel__track" id="rouletteTrack"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="gr-actions">
                        <div id="rouletteResult" class="gr-result">Нажмите "ЗАПУСТИТЬ РОЗЫГРЫШ"</div>
                        <button type="button" class="gr-spin" id="spinBtn">
                            <span class="gr-spin__label">
                                ЗАПУСТИТЬ РОЗЫГРЫШ
                                <span class="cost">⭐ 150</span>
                            </span>
                        </button>
                        <p class="gr-hint">NFT-подарки Telegram · выигрывайте уникальные подарки</p>
                    </div>
                </div>
            </div>

            <div class="screen" id="screenProfile">
                <div class="glass-card" style="text-align:center;">
                    <div class="profile-avatar" id="profileAvatar">👤</div>
                    <div style="font-size:18px; font-weight:600;" id="profileName">Аноним</div>
                    <div style="color:var(--text-secondary); font-size:13px;" id="profileId">ID: 0</div>
                    <div class="profile-stats">
                        <div class="stat-box"><div class="value" id="statNFT">0</div><div class="label">NFT</div></div>
                        <div class="stat-box"><div class="value" id="statBalance">0 ⭐</div><div class="label">Баланс</div></div>
                        <div class="stat-box"><div class="value" id="statSpins">0</div><div class="label">Спинов</div></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="nav-center">
            <div class="nav-btn active" data-screen="screenInventory">
                <span class="icon">📦</span> ИНВЕНТАРЬ
            </div>
            <div class="nav-btn" data-screen="screenRoulette">
                <span class="icon">🎰</span> РУЛЕТКА
            </div>
            <div class="nav-btn" data-screen="screenProfile">
                <span class="icon">👤</span> ПРОФИЛЬ
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---------- TELEGRAM SDK ----------
            let tg = null;
            let isTelegram = false;

            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    isTelegram = true;
                    console.log('Telegram WebApp инициализирован');
                } else {
                    console.warn('Telegram WebApp не обнаружен. Режим эмуляции.');
                    tg = {
                        ready: () => {},
                        expand: () => {},
                        showAlert: (msg) => alert(msg),
                        sendData: (data) => console.log('Telegram sendData:', data),
                        initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                    };
                }
            } catch (e) {
                console.error('Ошибка инициализации Telegram:', e);
                tg = {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                };
            }

            const USER_ID = tg.initDataUnsafe?.user?.id || 12345;

            // ---------- NFT ПОДАРКИ - ИЗ ПЕРВОГО КОДА (GIF) ----------
            const BASE_URL = 'https://judepip.github.io/NFT-LAB';
            const GIFTS = [
                { name: 'Bow Tie', price: 800, image: BASE_URL + '/images/BowTie.gif' },
                { name: 'Chill Flame', price: 500, image: BASE_URL + '/images/ChillFlame.gif' },
                { name: 'Big Year', price: 500, image: BASE_URL + '/images/BigYear.gif' },
                { name: 'JACK IN THE BOX', price: 600, image: BASE_URL + '/images/JackInTheBox.gif' },
                { name: 'Liberty Figure', price: 450, image: BASE_URL + '/images/LibertyFigure.gif' },
                { name: 'Light Sword', price: 480, image: BASE_URL + '/images/LightSword.gif' },
                { name: 'Star Notepad', price: 480, image: BASE_URL + '/images/StarNotepad.gif' },
                { name: 'Кубок', price: 100, image: BASE_URL + '/images/Кубок.gif' },
                { name: 'Кольцо', price: 100, image: BASE_URL + '/images/Кольцо.gif' },
                { name: 'Мишка', price: 15, image: BASE_URL + '/images/Мишка.gif' },
            ];

            // Шансы выпадения (из первого кода)
            const PAID_CHANCES = [10, 8, 6, 5, 4, 3, 1, 18, 20, 25];

            function getRandomGiftByChance() {
                const totalChance = PAID_CHANCES.reduce((sum, c) => sum + c, 0);
                let random = Math.random() * totalChance;
                for (let i = 0; i < GIFTS.length; i++) {
                    random -= PAID_CHANCES[i];
                    if (random <= 0) {
                        return GIFTS[i];
                    }
                }
                return GIFTS[0];
            }

            // ---------- СОСТОЯНИЕ ----------
            const STORAGE_KEY = 'lab_nft_simple';

            function getDefaultState() {
                return {
                    inventory: [],
                    balance: 1000,
                    spins: 0,
                    isSpinning: false,
                };
            }

            let state;

            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = parsed;
                    console.log('Состояние загружено из localStorage');
                } else {
                    state = getDefaultState();
                    console.log('Создано новое состояние');
                }
            } catch (e) {
                console.warn('Ошибка загрузки состояния:', e);
                state = getDefaultState();
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (e) {
                    console.warn('Ошибка сохранения состояния:', e);
                }
            }

            // ---------- DOM ----------
            const $ = (id) => document.getElementById(id);
            const balanceDisplay = $('balanceDisplay');
            const nftCount = $('nftCount');
            const screens = document.querySelectorAll('.screen');
            const navBtns = document.querySelectorAll('.nav-btn');
            const inventoryGrid = $('inventoryGrid');
            const rouletteTrack = $('rouletteTrack');
            const spinBtn = $('spinBtn');
            const rouletteResult = $('rouletteResult');
            const profileName = $('profileName');
            const profileId = $('profileId');
            const statNFT = $('statNFT');
            const statBalance = $('statBalance');
            const statSpins = $('statSpins');

            // ---------- ОТПРАВКА В БОТА ----------
            function sendToBot(data) {
                try {
                    if (isTelegram && tg && typeof tg.sendData === 'function') {
                        tg.sendData(JSON.stringify(data));
                    } else {
                        console.log('Emulated sendData:', JSON.stringify(data));
                    }
                } catch (e) {
                    console.warn('sendData error:', e);
                }
            }

            // ---------- МОДАЛЬНОЕ ОКНО ----------
            function showModal(gift, showSell = false) {
                const oldModal = document.querySelector('.modal-overlay');
                if (oldModal) oldModal.remove();

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';

                let buttonsHtml = '';
                if (showSell) {
                    buttonsHtml = `
                        <button class="modal-btn btn-sell" data-action="sell">💸 ПРОДАТЬ</button>
                        <button class="modal-btn btn-close" data-action="close">ЗАКРЫТЬ</button>
                    `;
                } else {
                    buttonsHtml = `
                        <button class="modal-btn btn-inventory" data-action="inventory">📦 В ИНВЕНТАРЬ</button>
                        <button class="modal-btn btn-close" data-action="close">ЗАКРЫТЬ</button>
                    `;
                }

                overlay.innerHTML = `
                    <div class="modal-content">
                        <button class="modal-close-icon" id="modalCloseIcon">✕</button>
                        <img class="modal-gif" src="${gift.image}" alt="${gift.name}" loading="lazy">
                        <div class="modal-title">${gift.name}</div>
                        <div class="modal-price">⭐ ${gift.price}</div>
                        <div class="modal-actions">
                            ${buttonsHtml}
                        </div>
                    </div>
                `;

                document.body.appendChild(overlay);

                const closeBtn = overlay.querySelector('#modalCloseIcon');
                const closeActionBtn = overlay.querySelector('[data-action="close"]');
                const inventoryBtn = overlay.querySelector('[data-action="inventory"]');
                const sellBtn = overlay.querySelector('[data-action="sell"]');

                const closeModal = () => overlay.remove();

                closeBtn.addEventListener('click', closeModal);
                if (closeActionBtn) closeActionBtn.addEventListener('click', closeModal);

                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) closeModal();
                });

                if (inventoryBtn) {
                    inventoryBtn.addEventListener('click', function() {
                        closeModal();
                        switchScreen('screenInventory');
                    });
                }

                if (sellBtn) {
                    sellBtn.addEventListener('click', function() {
                        const itemIndex = state.inventory.findIndex(item => item.id === gift.id);
                        if (itemIndex === -1) {
                            tg.showAlert('❌ Этот подарок уже продан!');
                            closeModal();
                            return;
                        }
                        state.inventory.splice(itemIndex, 1);
                        state.balance += gift.price;
                        render();
                        closeModal();
                        tg.showAlert('✅ Вы продали ' + gift.name + ' за ⭐' + gift.price + '!');
                        sendToBot({
                            action: 'sell_nft',
                            payload: {
                                name: gift.name,
                                price: gift.price,
                                balance: state.balance
                            }
                        });
                    });
                }
            }

            // ---------- РЕНДЕР ----------
            function render() {
                balanceDisplay.textContent = Math.floor(state.balance);
                nftCount.textContent = state.inventory.length + ' шт.';

                if (state.inventory.length === 0) {
                    inventoryGrid.innerHTML = '<div class="empty-inventory">🧪 Нет подарков. Крутите рулетку!</div>';
                } else {
                    inventoryGrid.innerHTML = state.inventory.map(item => {
                        const iconHtml = item.image ?
                            '<img class="nft-image" src="' + item.image + '" alt="' + item.name +
                            '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">' +
                            '<div class="nft-icon" style="display:none;">🎁</div>' :
                            '<div class="nft-icon">🎁</div>';
                        return `
                                <div class="nft-item" data-id="${item.id}">
                                    <div class="glow-pulse"></div>
                                    ${iconHtml}
                                    <div class="nft-name">${item.name}</div>
                                </div>
                            `;
                    }).join('');
                }

                profileName.textContent = tg.initDataUnsafe?.user?.first_name || 'Аноним';
                profileId.textContent = 'ID: ' + USER_ID;
                statNFT.textContent = state.inventory.length;
                statBalance.textContent = Math.floor(state.balance) + ' ⭐';
                statSpins.textContent = state.spins;

                saveState();
            }

            // ---------- НАВИГАЦИЯ ----------
            function switchScreen(screenId) {
                screens.forEach(s => s.classList.remove('active'));
                const target = document.getElementById(screenId);
                if (target) target.classList.add('active');
                navBtns.forEach(btn => {
                    const scr = btn.dataset.screen;
                    btn.classList.toggle('active', scr === screenId);
                });
            }

            navBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const screenId = this.dataset.screen;
                    if (screenId) switchScreen(screenId);
                    if (navigator.vibrate) navigator.vibrate(10);
                });
            });

            // ---------- СОЗДАНИЕ РУЛЕТКИ ----------
            function createRoulette() {
                const REPEAT_COUNT = 10;
                let html = '';
                for (let rep = 0; rep < REPEAT_COUNT; rep++) {
                    GIFTS.forEach((gift, index) => {
                        html += `
                            <div class="gr-reel__item" data-gift-index="${index}">
                                <div class="gr-reel__card">
                                    <div class="gr-reel__card-shine" aria-hidden="true"></div>
                                    <img src="${gift.image}" alt="${gift.name}" draggable="false" loading="lazy"
                                         onerror="this.style.display='none'">
                                    <div class="gift-name">${gift.name}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                rouletteTrack.innerHTML = html;
                rouletteTrack.style.transition = 'none';
                rouletteTrack.style.transform = 'translate3d(0px, 0, 0)';
                void rouletteTrack.offsetWidth;
                rouletteTrack.style.transition = '';
            }

            // ---------- ФУНКЦИЯ ВРАЩЕНИЯ ----------
            function performSpin() {
                if (state.isSpinning) return;

                if (state.balance < 150) {
                    rouletteResult.textContent = '❌ Недостаточно ⭐ (нужно 150)';
                    tg.showAlert('Недостаточно звёзд! Нужно 150 ⭐');
                    return;
                }

                state.isSpinning = true;
                spinBtn.disabled = true;
                rouletteResult.textContent = '🌀 Крутим...';

                const prize = getRandomGiftByChance();
                const winIndex = GIFTS.indexOf(prize);

                // Убираем подсветку
                document.querySelectorAll('.gr-reel__item.winning').forEach(el => el.classList.remove('winning'));

                // Вычисляем смещение
                const items = document.querySelectorAll('.gr-reel__item');
                const totalItems = items.length;
                
                // Находим ячейку в 4-м повторении
                const targetItemIndex = 4 * GIFTS.length + winIndex;

                if (targetItemIndex >= totalItems) {
                    console.error('Целевой индекс за пределами массива');
                    state.isSpinning = false;
                    spinBtn.disabled = false;
                    return;
                }

                const itemWidth = items[0]?.offsetWidth + 8 || 80;
                const viewportWidth = document.querySelector('.gr-reel__viewport').offsetWidth || 300;
                const targetOffset = targetItemIndex * itemWidth;
                const offsetPx = targetOffset - viewportWidth / 2 + itemWidth / 2;

                // Применяем анимацию
                rouletteTrack.style.transition = 'none';
                void rouletteTrack.offsetWidth;
                rouletteTrack.style.transition = 'transform 4.5s cubic-bezier(0.1, 0.6, 0.15, 1)';
                rouletteTrack.style.transform = 'translate3d(-' + offsetPx + 'px, 0, 0)';

                if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 80]);

                setTimeout(() => {
                    // Находим победителя
                    const allItems = document.querySelectorAll('.gr-reel__item');
                    const centerX = window.innerWidth / 2;
                    let closestItem = null;
                    let closestDist = Infinity;

                    allItems.forEach(item => {
                        const rect = item.getBoundingClientRect();
                        const itemCenter = rect.left + rect.width / 2;
                        const dist = Math.abs(itemCenter - centerX);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestItem = item;
                        }
                    });

                    if (closestItem) {
                        closestItem.classList.add('winning');
                        const actualIndex = parseInt(closestItem.dataset.giftIndex, 10);
                        const actualPrize = GIFTS[actualIndex] || prize;

                        state.balance -= 150;
                        state.spins += 1;
                        const newGift = {
                            id: 'gift_' + Date.now(),
                            name: actualPrize.name,
                            image: actualPrize.image,
                            price: actualPrize.price,
                        };
                        state.inventory.push(newGift);

                        rouletteResult.textContent = '🎉 Вы выиграли: ' + actualPrize.name + '!';
                        render();
                        showModal(newGift, false);

                        sendToBot({
                            action: 'roulette_spin',
                            payload: {
                                prize: actualPrize.name,
                                balance: state.balance,
                            }
                        });
                    } else {
                        rouletteResult.textContent = '❌ Ошибка определения победителя';
                    }
                }, 4500);

                setTimeout(() => {
                    state.isSpinning = false;
                    spinBtn.disabled = false;
                }, 5200);
            }

            // ---------- ОБРАБОТЧИКИ ----------
            spinBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performSpin();
            });

            spinBtn.addEventListener('dblclick', function(e) {
                e.preventDefault();
                if (!state.isSpinning) {
                    spinBtn.click();
                    tg.showAlert('⚡ БЫСТРОЕ КРУЧЕНИЕ!');
                }
            });

            // Клик по NFT в инвентаре
            inventoryGrid.addEventListener('click', function(e) {
                const item = e.target.closest('.nft-item');
                if (!item) return;
                const id = item.dataset.id;
                const gift = state.inventory.find(n => n.id === id);
                if (gift) {
                    showModal(gift, true);
                    sendToBot({
                        action: 'view_nft',
                        payload: { nftId: gift.id, name: gift.name }
                    });
                }
            });

            // ---------- ИНИЦИАЛИЗАЦИЯ ----------
            createRoulette();
            render();

            console.log('[LAB NFT] Mini App загружен. User ID:', USER_ID);
            console.log('[LAB NFT] Всего подарков:', GIFTS.length);

            // Обработка изменения размера окна
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (!state.isSpinning) {
                        createRoulette();
                    }
                }, 300);
            });
        })();
    </script>
</body>
</html>
