<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAB NFT · Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СБРОС ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #12182b;
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --glass-bg: rgba(18, 24, 43, 0.65);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-primary: #e8f0f8;
            --text-secondary: #8899bb;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* ---------- ФОН С ШЕСТИУГОЛЬНОЙ СЕТКОЙ (LAB STYLE) ---------- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                repeating-linear-gradient(60deg, transparent, transparent 40px, rgba(0,255,136,0.02) 40px, rgba(0,255,136,0.02) 41px),
                repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(0,212,255,0.02) 40px, rgba(0,212,255,0.02) 41px);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- ОСНОВНОЙ КОНТЕЙНЕР (СТЕКЛО) ---------- */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: 8px 12px 8px 12px;
            backdrop-filter: blur(2px);
        }

        /* ---------- ВЕРХНИЙ БАР: ЗАГОЛОВОК + БАЛАНС ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px 14px 6px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        .balance {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--neon-green);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .balance span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ---------- ЦЕНТРАЛЬНАЯ ОБЛАСТЬ (КОНТЕНТ) ---------- */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 10px 0 10px 0;
            padding: 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
            min-height: 0;
        }
        .content::-webkit-scrollbar {
            width: 3px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }

        /* ---------- КАРТОЧКИ ЭКРАНОВ (переключаются через display) ---------- */
        .screen {
            display: none;
            animation: fadeSlide 0.25s ease-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ---------- СТИЛИ ДЛЯ КАЖДОГО ЭКРАНА ---------- */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* ----- ЭКРАН: ИНВЕНТАРЬ (NFT-подарки) ----- */
        .nft-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .nft-item {
            aspect-ratio: 1/1;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0,255,136,0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .nft-item::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.05), transparent, rgba(0,212,255,0.05), transparent);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        .nft-item .nft-icon {
            font-size: 36px;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.4));
        }
        .nft-item .nft-name {
            z-index: 1;
            margin-top: 4px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .nft-item .nft-rarity {
            z-index: 1;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0,255,136,0.15);
            color: var(--neon-green);
            margin-top: 2px;
        }
        .empty-inventory {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        /* ----- ЭКРАН: РУЛЕТКА ----- */
        .roulette-wheel {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 320px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, #00ff88, #00d4ff, #7b2ffc, #ff2d75, #ffaa00, #00ff88
            );
            box-shadow: 0 0 60px rgba(0,255,136,0.2), inset 0 0 60px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .roulette-wheel .center-dot {
            width: 20%;
            aspect-ratio: 1/1;
            background: var(--bg-primary);
            border-radius: 50%;
            border: 3px solid var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green);
        }
        .roulette-btn {
            background: var(--neon-green);
            color: #0a0e1a;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 18px;
            font-family: var(--font-mono);
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            display: block;
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
            transition: 0.15s;
            cursor: pointer;
        }
        .roulette-btn:active { transform: scale(0.96); opacity: 0.8; }
        .roulette-btn:disabled {
            opacity: 0.4;
            transform: scale(1);
            pointer-events: none;
        }

        /* ----- ЭКРАН: АПГРЕЙД ----- */
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .upgrade-item:last-child { border-bottom: none; }
        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .upgrade-info .title {
            font-weight: 500;
        }
        .upgrade-info .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .upgrade-level {
            font-size: 13px;
            color: var(--neon-cyan);
            background: rgba(0,212,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .upgrade-cost {
            font-size: 12px;
            color: var(--neon-green);
            margin-right: 12px;
        }
        .upgrade-btn {
            background: rgba(0,255,136,0.12);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 18px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .upgrade-btn:active { transform: scale(0.94); }
        .upgrade-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* ----- ЭКРАН: ПРОФИЛЬ ----- */
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-box .value {
            font-size: 22px;
            font-weight: 600;
            color: var(--neon-green);
        }
        .stat-box .label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ----- ЭКРАН: ИГРЫ ----- */
        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.15s;
            cursor: pointer;
        }
        .game-card:active { transform: scale(0.98); border-color: var(--neon-cyan); }
        .game-icon { font-size: 32px; }
        .game-info .gname { font-weight: 500; }
        .game-info .gdesc { font-size: 12px; color: var(--text-secondary); }

        /* ---------- НАВИГАЦИЯ (КНОПКИ) ---------- */
        .nav-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
            padding: 6px 0 4px 0;
        }
        .nav-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
            padding: 4px 0 8px 0;
        }
        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 4px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.15s;
            cursor: pointer;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn .icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-btn:active { transform: scale(0.94); }
        .nav-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0,255,136,0.08);
            background: rgba(0,255,136,0.05);
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 380px) {
            .header h1 { font-size: 15px; }
            .balance { font-size: 12px; padding: 4px 12px; }
            .nav-btn { font-size: 11px; padding: 10px 2px; }
            .nav-btn .icon { font-size: 17px; }
        }
        @media (min-height: 800px) {
            .content { margin: 16px 0; }
        }

        /* ---------- МИКРО-АНИМАЦИЯ ДЛЯ NFT ---------- */
        .nft-item .glow-pulse {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(0,255,136,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .nft-item:hover .glow-pulse { opacity: 1; }
    </style>
</head>
<body>
<div id="app">

    <!-- ВЕРХНИЙ БАР -->
    <div class="header">
        <h1>🧪 LAB NFT</h1>
        <div class="balance">
            <span>⚡</span> <span id="balanceDisplay">1,247.5</span> <span>GIFT</span>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ -->
    <div class="content" id="contentArea">

        <!-- ЭКРАН: ИНВЕНТАРЬ (по умолчанию активен) -->
        <div class="screen active" id="screenInventory">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span style="font-weight:500;">📦 NFT-подарки</span>
                    <span style="color:var(--text-secondary);font-size:12px;" id="nftCount">6 шт.</span>
                </div>
                <div class="nft-grid" id="inventoryGrid">
                    <!-- заполняется JS -->
                </div>
            </div>
        </div>

        <!-- ЭКРАН: РУЛЕТКА -->
        <div class="screen" id="screenRoulette">
            <div class="glass-card">
                <div style="text-align:center; margin-bottom:8px; color:var(--text-secondary); font-size:13px;">
                    🎰 Крути и выигрывай NFT
                </div>
                <div class="roulette-wheel" id="rouletteWheel">
                    <div class="center-dot"></div>
                </div>
                <button class="roulette-btn" id="spinBtn">▶ СПИН (25 GIFT)</button>
                <div id="rouletteResult" style="text-align:center; margin-top:12px; font-size:14px; min-height:24px; color:var(--neon-cyan);"></div>
            </div>
        </div>

        <!-- ЭКРАН: АПГРЕЙД -->
        <div class="screen" id="screenUpgrade">
            <div class="glass-card">
                <div style="margin-bottom:10px; font-weight:500;">🔧 Улучшения лаборатории</div>
                <div id="upgradeList">
                    <!-- заполняется JS -->
                </div>
            </div>
        </div>

        <!-- ЭКРАН: ПРОФИЛЬ -->
        <div class="screen" id="screenProfile">
            <div class="glass-card" style="text-align:center;">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div style="font-size:18px; font-weight:600;" id="profileName">Аноним</div>
                <div style="color:var(--text-secondary); font-size:13px;" id="profileId">ID: 0</div>
                <div class="profile-stats">
                    <div class="stat-box"><div class="value" id="statNFT">6</div><div class="label">NFT</div></div>
                    <div class="stat-box"><div class="value" id="statLevel">3</div><div class="label">Уровень</div></div>
                    <div class="stat-box"><div class="value" id="statSpins">42</div><div class="label">Спинов</div></div>
                    <div class="stat-box"><div class="value" id="statUpgrades">5</div><div class="label">Апгрейдов</div></div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН: ИГРЫ -->
        <div class="screen" id="screenGames">
            <div class="glass-card">
                <div style="margin-bottom:12px; font-weight:500;">🎮 Игровой центр</div>
                <div id="gamesList">
                    <!-- заполняется JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- ЦЕНТРАЛЬНЫЕ КНОПКИ -->
    <div class="nav-center">
        <div class="nav-btn active" data-screen="screenInventory">
            <span class="icon">📦</span> ИНВЕНТАРЬ
        </div>
        <div class="nav-btn" data-screen="screenRoulette">
            <span class="icon">🎰</span> РУЛЕТКА
        </div>
        <div class="nav-btn" data-screen="screenUpgrade">
            <span class="icon">🔧</span> АПГРЕЙД
        </div>
    </div>

    <!-- НИЖНИЕ КНОПКИ -->
    <div class="nav-bottom">
        <div class="nav-btn" data-screen="screenProfile">
            <span class="icon">👤</span> ПРОФИЛЬ
        </div>
        <div class="nav-btn" data-screen="screenGames">
            <span class="icon">🎮</span> ИГРЫ
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ---------- 1. TELEGRAM SDK (БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ) ----------
        let tg = null;
        let isTelegram = false;

        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                isTelegram = true;
            } else {
                console.warn('Telegram WebApp не обнаружен. Работа в режиме эмуляции.');
                // Эмуляция для браузера
                tg = {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                };
            }
        } catch (e) {
            console.error('Ошибка инициализации Telegram:', e);
            // Фолбэк
            tg = {
                ready: () => {},
                expand: () => {},
                showAlert: (msg) => alert(msg),
                sendData: (data) => console.log('Telegram sendData:', data),
                initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
            };
        }

        // ---------- 2. СОСТОЯНИЕ ПРИЛОЖЕНИЯ (С СОХРАНЕНИЕМ В localStorage) ----------
        const STORAGE_KEY = 'lab_nft_state';

        function getDefaultState() {
            return {
                balance: 1247.5,
                user: tg.initDataUnsafe?.user || { id: 0, first_name: 'Аноним' },
                inventory: [
                    { id: 'nft1', name: 'Кристалл Омега', rarity: 'легенд', icon: '💎' },
                    { id: 'nft2', name: 'Теневой чип', rarity: 'эпик', icon: '🖲️' },
                    { id: 'nft3', name: 'Голограмма X', rarity: 'редкий', icon: '🌀' },
                    { id: 'nft4', name: 'Нейро-куб', rarity: 'обычный', icon: '🧊' },
                    { id: 'nft5', name: 'Плазменный шар', rarity: 'эпик', icon: '⚡' },
                    { id: 'nft6', name: 'Квантовый глаз', rarity: 'легенд', icon: '👁️' },
                ],
                upgrades: [
                    { id: 'up1', name: 'Генератор GIFT', desc: '+5 GIFT/час', level: 2, cost: 150, maxLvl: 5 },
                    { id: 'up2', name: 'Сканер редкости', desc: 'Шанс NFT +3%', level: 1, cost: 200, maxLvl: 4 },
                    { id: 'up3', name: 'Ускоритель спина', desc: 'Спин стоит -2 GIFT', level: 0, cost: 100, maxLvl: 6 },
                ],
                games: [
                    { id: 'g1', name: 'Мем-арена', desc: 'Сражайся мемами', icon: '🐸' },
                    { id: 'g2', name: 'Кликер GIFT', desc: 'Тапай для токенов', icon: '🖱️' },
                    { id: 'g3', name: 'Угадай хеш', desc: 'Угадай SHA-256', icon: '🔐' },
                ],
                spins: 42,
                level: 3,
                upgradeCount: 5,
                rouletteAngle: 0,
                isSpinning: false,
            };
        }

        let state;

        // Загрузка состояния из localStorage или создание нового
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                state = parsed;
                // Перезаписываем user из Telegram (чтобы всегда был актуальный)
                if (tg.initDataUnsafe?.user) {
                    state.user = tg.initDataUnsafe.user;
                }
                console.log('Состояние загружено из localStorage');
            } else {
                state = getDefaultState();
                console.log('Создано новое состояние');
            }
        } catch (e) {
            console.warn('Ошибка загрузки состояния:', e);
            state = getDefaultState();
        }

        // Функция сохранения состояния
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Ошибка сохранения состояния:', e);
            }
        }

        // ---------- 3. DOM-ССЫЛКИ ----------
        const $ = (id) => document.getElementById(id);
        const balanceDisplay = $('balanceDisplay');
        const nftCount = $('nftCount');
        const screens = document.querySelectorAll('.screen');
        const navBtns = document.querySelectorAll('.nav-btn');
        const inventoryGrid = $('inventoryGrid');
        const upgradeList = $('upgradeList');
        const gamesList = $('gamesList');
        const rouletteWheel = $('rouletteWheel');
        const spinBtn = $('spinBtn');
        const rouletteResult = $('rouletteResult');

        // Профиль
        const profileName = $('profileName');
        const profileId = $('profileId');
        const statNFT = $('statNFT');
        const statLevel = $('statLevel');
        const statSpins = $('statSpins');
        const statUpgrades = $('statUpgrades');

        // ---------- 4. ФУНКЦИЯ ОБНОВЛЕНИЯ UI ----------
        function render() {
            // Баланс
            balanceDisplay.textContent = state.balance.toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

            // Количество NFT в заголовке
            nftCount.textContent = state.inventory.length + ' шт.';

            // ИНВЕНТАРЬ
            if (state.inventory.length === 0) {
                inventoryGrid.innerHTML = `<div class="empty-inventory">🧪 Нет NFT-подарков. Крутите рулетку!</div>`;
            } else {
                inventoryGrid.innerHTML = state.inventory.map(item => `
                    <div class="nft-item" data-id="${item.id}">
                        <div class="glow-pulse"></div>
                        <div class="nft-icon">${item.icon}</div>
                        <div class="nft-name">${item.name}</div>
                        <div class="nft-rarity">${item.rarity}</div>
                    </div>
                `).join('');
            }

            // АПГРЕЙДЫ
            upgradeList.innerHTML = state.upgrades.map(u => {
                const isMax = u.level >= u.maxLvl;
                const canAfford = state.balance >= u.cost && !isMax;
                return `
                    <div class="upgrade-item" data-id="${u.id}">
                        <div class="upgrade-info">
                            <div class="title">${u.name}</div>
                            <div class="desc">${u.desc}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="upgrade-level">Ур.${u.level}/${u.maxLvl}</span>
                            <span class="upgrade-cost">${isMax ? 'MAX' : u.cost + ' GIFT'}</span>
                            <button class="upgrade-btn" data-id="${u.id}" ${!canAfford ? 'disabled' : ''}>
                                ${isMax ? '✔' : '↑'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // ИГРЫ
            gamesList.innerHTML = state.games.map(g => `
                <div class="game-card" data-id="${g.id}">
                    <div class="game-icon">${g.icon}</div>
                    <div class="game-info">
                        <div class="gname">${g.name}</div>
                        <div class="gdesc">${g.desc}</div>
                    </div>
                </div>
            `).join('');

            // ПРОФИЛЬ
            profileName.textContent = state.user.first_name || 'Аноним';
            profileId.textContent = `ID: ${state.user.id || 0}`;
            statNFT.textContent = state.inventory.length;
            statLevel.textContent = state.level;
            statSpins.textContent = state.spins;
            statUpgrades.textContent = state.upgradeCount;

            // Сохраняем состояние после каждого рендера
            saveState();
        }

        // ---------- 5. НАВИГАЦИЯ (ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ) ----------
        function switchScreen(screenId) {
            screens.forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');
            navBtns.forEach(btn => {
                const scr = btn.dataset.screen;
                btn.classList.toggle('active', scr === screenId);
            });
        }

        navBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const screenId = this.dataset.screen;
                if (screenId) switchScreen(screenId);
                if (navigator.vibrate) navigator.vibrate(10);
            });
        });

        // ---------- 6. РУЛЕТКА (ЛОГИКА) ----------
        const prizes = ['💎 Кристалл', '🖲️ Чип', '🌀 Голограмма', '🧊 Куб', '⚡ Шар', '👁️ Глаз', '❌ Пусто', '❌ Пусто'];

        spinBtn.addEventListener('click', function() {
            if (state.isSpinning) return;
            if (state.balance < 25) {
                rouletteResult.textContent = '❌ Недостаточно GIFT (нужно 25)';
                tg.showAlert('Недостаточно GIFT!');
                return;
            }

            state.isSpinning = true;
            spinBtn.disabled = true;
            state.balance -= 25;
            state.spins += 1;
            render();

            const winIndex = Math.floor(Math.random() * prizes.length);
            const prize = prizes[winIndex];
            const extraDeg = 360 / prizes.length;
            const targetDeg = 360 * 6 + (winIndex * extraDeg) + (extraDeg / 2);
            state.rouletteAngle += targetDeg;
            rouletteWheel.style.transform = `rotate(${state.rouletteAngle}deg)`;

            if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 80]);

            setTimeout(() => {
                state.isSpinning = false;
                spinBtn.disabled = false;
                if (prize !== '❌ Пусто') {
                    const newNft = {
                        id: 'nft_' + Date.now(),
                        name: prize + ' #' + (state.inventory.length + 1),
                        rarity: ['обычный','редкий','эпик','легенд'][Math.floor(Math.random()*4)],
                        icon: prize.split(' ')[0]
                    };
                    state.inventory.push(newNft);
                    rouletteResult.textContent = `🎉 Выиграли: ${prize}! (добавлен в инвентарь)`;
                    tg.showAlert(`🎉 Поздравляем! Выиграли ${prize}!`);
                } else {
                    rouletteResult.textContent = '😞 Пусто. Попробуйте ещё!';
                }
                render();
                sendToBot({
                    action: 'roulette_spin',
                    payload: { prize: prize, balance: state.balance }
                });
            }, 4500);
        });

        // ---------- 7. ОБРАБОТЧИКИ ДЛЯ АПГРЕЙДОВ ----------
        upgradeList.addEventListener('click', function(e) {
            const btn = e.target.closest('.upgrade-btn');
            if (!btn) return;
            if (btn.disabled) return;
            const id = btn.dataset.id;
            const upgrade = state.upgrades.find(u => u.id === id);
            if (!upgrade) return;
            if (upgrade.level >= upgrade.maxLvl) return;
            if (state.balance < upgrade.cost) {
                tg.showAlert('Недостаточно GIFT для апгрейда!');
                return;
            }
            state.balance -= upgrade.cost;
            upgrade.level += 1;
            upgrade.cost = Math.floor(upgrade.cost * 1.4);
            state.upgradeCount += 1;
            render();
            sendToBot({
                action: 'upgrade',
                payload: { id: upgrade.id, newLevel: upgrade.level }
            });
            if (navigator.vibrate) navigator.vibrate(20);
        });

        // ---------- 8. ОБРАБОТЧИКИ ДЛЯ ИГР ----------
        gamesList.addEventListener('click', function(e) {
            const card = e.target.closest('.game-card');
            if (!card) return;
            const id = card.dataset.id;
            const game = state.games.find(g => g.id === id);
            if (!game) return;
            tg.showAlert(`🎮 Игра "${game.name}" запускается... (демо)`);
            sendToBot({
                action: 'play_game',
                payload: { gameId: game.id, gameName: game.name }
            });
            if (navigator.vibrate) navigator.vibrate(15);
        });

        // ---------- 9. КЛИК ПО NFT ----------
        inventoryGrid.addEventListener('click', function(e) {
            const item = e.target.closest('.nft-item');
            if (!item) return;
            const id = item.dataset.id;
            const nft = state.inventory.find(n => n.id === id);
            if (nft) {
                tg.showAlert(`📦 ${nft.name}\nРедкость: ${nft.rarity}\nID: ${nft.id}`);
                sendToBot({
                    action: 'view_nft',
                    payload: { nftId: nft.id, name: nft.name }
                });
            }
        });

        // ---------- 10. ОТПРАВКА ДАННЫХ В БОТА ----------
        function sendToBot(data) {
            try {
                if (isTelegram && tg && typeof tg.sendData === 'function') {
                    tg.sendData(JSON.stringify(data));
                } else {
                    console.log('Emulated sendData:', JSON.stringify(data));
                }
            } catch (e) {
                console.warn('sendData error:', e);
            }
        }

        // ---------- 11. ИНИЦИАЛИЗАЦИЯ ----------
        render();
        rouletteWheel.style.transform = `rotate(0deg)`;

        sendToBot({
            action: 'app_open',
            payload: { user_id: state.user.id, timestamp: Date.now() }
        });

        console.log('[LAB NFT] Mini App полностью загружен. Состояние:', state);
        console.log('[LAB NFT] Режим Telegram:', isTelegram);
    })();
</script>
</body>
</html>
