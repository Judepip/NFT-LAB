<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAB NFT · Mini App</title>
    <script>
        if (!window.Telegram) {
            window.Telegram = {
                WebApp: {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                }
            };
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js" onerror="console.warn('Telegram SDK не загрузился, используется эмуляция')"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #12182b;
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --glass-bg: rgba(18, 24, 43, 0.65);
            --glass-border: rgba(0, 255, 136, 0.15);
            --text-primary: #e8f0f8;
            --text-secondary: #8899bb;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                repeating-linear-gradient(60deg, transparent, transparent 40px, rgba(0,255,136,0.02) 40px, rgba(0,255,136,0.02) 41px),
                repeating-linear-gradient(-60deg, transparent, transparent 40px, rgba(0,212,255,0.02) 40px, rgba(0,212,255,0.02) 41px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            padding: 8px 12px 8px 12px;
            backdrop-filter: blur(2px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 6px 14px 6px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,255,136,0.2);
        }
        .balance {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--neon-green);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .balance span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin: 10px 0 10px 0;
            padding: 4px 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
            min-height: 0;
        }
        .content::-webkit-scrollbar {
            width: 3px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }

        .screen {
            display: none;
            animation: fadeSlide 0.25s ease-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .nft-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .nft-item {
            aspect-ratio: 1/1;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0,255,136,0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            padding: 4px;
        }
        .nft-item::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.05), transparent, rgba(0,212,255,0.05), transparent);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        .nft-item .nft-icon {
            font-size: 36px;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.4));
        }
        .nft-item .nft-image {
            width: 64px;
            height: 64px;
            object-fit: contain;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.3));
        }
        .nft-item .nft-name {
            z-index: 1;
            margin-top: 4px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
            max-width: 100%;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .nft-item .nft-rarity {
            z-index: 1;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0,255,136,0.15);
            color: var(--neon-green);
            margin-top: 2px;
            white-space: nowrap;
        }
        .empty-inventory {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }

        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .roulette-track {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            padding: 8px 0;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .roulette-slider {
            display: flex;
            gap: 8px;
            padding: 0 8px;
            will-change: transform;
            transition: transform 5s cubic-bezier(0.1, 0.6, 0.2, 1);
        }

        .roulette-cell {
            flex: 0 0 calc(20% - 8px);
            min-width: 60px;
            aspect-ratio: 3/4;
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 1px solid rgba(0,255,136,0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,255,136,0.03);
            overflow: hidden;
        }

        .roulette-cell img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.2));
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .roulette-cell .cell-name {
            font-size: 7px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
            max-width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 0 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 16px;
        }

        .roulette-cell .cell-rarity {
            font-size: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 1px 4px;
            border-radius: 8px;
            background: rgba(0,255,136,0.1);
            color: var(--neon-green);
            margin-top: 1px;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .roulette-cell.highlight {
            border-color: var(--neon-green);
            box-shadow: 0 0 40px rgba(0,255,136,0.4);
            transform: scale(1.05);
        }
        .roulette-cell.highlight img {
            filter: drop-shadow(0 0 20px rgba(0,255,136,0.6));
        }

        .roulette-indicator {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: calc(100% + 4px);
            background: var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green), 0 0 60px rgba(0,255,136,0.3);
            border-radius: 2px;
            z-index: 10;
            pointer-events: none;
        }
        .roulette-indicator::before,
        .roulette-indicator::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-green);
            left: 50%;
            transform: translateX(-50%);
        }
        .roulette-indicator::before {
            top: -4px;
        }
        .roulette-indicator::after {
            bottom: -4px;
        }

        .roulette-btn {
            background: var(--neon-green);
            color: #0a0e1a;
            border: none;
            border-radius: 30px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 18px;
            font-family: var(--font-mono);
            width: 100%;
            max-width: 280px;
            box-shadow: 0 0 30px rgba(0,255,136,0.3);
            transition: 0.15s;
            cursor: pointer;
            margin-top: 4px;
        }
        .roulette-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .roulette-btn:disabled {
            opacity: 0.4;
            transform: scale(1);
            pointer-events: none;
        }

        .roulette-result {
            text-align: center;
            font-size: 14px;
            min-height: 24px;
            color: var(--neon-cyan);
            margin-top: 2px;
            font-weight: 500;
        }

        .roulette-hint {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 0;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .upgrade-item:last-child { border-bottom: none; }
        .upgrade-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .upgrade-info .title {
            font-weight: 500;
        }
        .upgrade-info .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .upgrade-level {
            font-size: 13px;
            color: var(--neon-cyan);
            background: rgba(0,212,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .upgrade-cost {
            font-size: 12px;
            color: var(--neon-green);
            margin-right: 12px;
        }
        .upgrade-btn {
            background: rgba(0,255,136,0.12);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 18px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .upgrade-btn:active { transform: scale(0.94); }
        .upgrade-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stat-box .value {
            font-size: 22px;
            font-weight: 600;
            color: var(--neon-green);
        }
        .stat-box .label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
            padding: 6px 0 4px 0;
        }
        .nav-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
            padding: 4px 0 8px 0;
        }
        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 4px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            transition: 0.15s;
            cursor: pointer;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn .icon {
            font-size: 20px;
            line-height: 1;
        }
        .nav-btn:active { transform: scale(0.94); }
        .nav-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 25px rgba(0,255,136,0.08);
            background: rgba(0,255,136,0.05);
        }

        @media (max-width: 380px) {
            .header h1 { font-size: 15px; }
            .balance { font-size: 12px; padding: 4px 12px; }
            .nav-btn { font-size: 11px; padding: 10px 2px; }
            .nav-btn .icon { font-size: 17px; }
            .roulette-cell { flex: 0 0 calc(25% - 8px); min-width: 50px; }
            .roulette-cell img { width: 36px; height: 36px; }
            .roulette-cell .cell-name { font-size: 7px; }
            .nft-item .nft-image { width: 48px; height: 48px; }
            .modal-content img { width: 100px; height: 100px; }
        }

        @media (min-width: 600px) {
            .roulette-cell { flex: 0 0 calc(16.66% - 8px); }
        }
        @media (min-width: 900px) {
            .roulette-cell { flex: 0 0 calc(12.5% - 8px); }
        }

        .nft-item .glow-pulse {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(0,255,136,0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .nft-item:hover .glow-pulse { opacity: 1; }

        /* ---------- КАСТОМНОЕ МОДАЛЬНОЕ ОКНО ДЛЯ ВЫИГРЫША ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
            padding: 20px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: radial-gradient(circle at 30% 30%, #1a2a4a, #0d1428);
            border: 2px solid var(--neon-green);
            border-radius: 24px;
            padding: 30px 24px 24px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.15);
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.03), transparent, rgba(0,212,255,0.03), transparent);
            animation: rotateGlow 8s linear infinite;
        }

        .modal-content .modal-gif {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 12px auto;
            display: block;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(0,255,136,0.3));
        }

        .modal-content .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
            margin-bottom: 4px;
        }

        .modal-content .modal-rarity {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-green);
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
        }

        .modal-content .modal-close-btn {
            background: var(--neon-green);
            color: #0a0e1a;
            border: none;
            border-radius: 30px;
            padding: 12px 32px;
            font-weight: 700;
            font-size: 16px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
            width: 100%;
            max-width: 200px;
        }

        .modal-content .modal-close-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div id="app">

    <div class="header">
        <h1>🧪 LAB NFT</h1>
        <div class="balance">
            <span>⚡</span> <span id="balanceDisplay">1,000.0</span> <span>GIFT</span>
        </div>
    </div>

    <div class="content" id="contentArea">

        <div class="screen active" id="screenInventory">
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <span style="font-weight:500;">📦 NFT-подарки</span>
                    <span style="color:var(--text-secondary);font-size:12px;" id="nftCount">0 шт.</span>
                </div>
                <div class="nft-grid" id="inventoryGrid"></div>
            </div>
        </div>

        <div class="screen" id="screenRoulette">
            <div class="glass-card">
                <div class="roulette-container">
                    <div class="roulette-track">
                        <div class="roulette-indicator"></div>
                        <div class="roulette-slider" id="rouletteSlider"></div>
                    </div>
                    <div id="rouletteResult" class="roulette-result">Нажмите "РАСКРУТИТЬ"</div>
                    <button class="roulette-btn" id="spinBtn">РАСКРУТИТЬ ЗА 150</button>
                    <div class="roulette-hint">⚡ ДВОЙНОЙ ТАП ДЛЯ БЫСТРОГО КРУЧЕНИЯ</div>
                </div>
            </div>
        </div>

        <div class="screen" id="screenUpgrade">
            <div class="glass-card">
                <div style="margin-bottom:10px; font-weight:500;">🔧 Улучшения лаборатории</div>
                <div id="upgradeList"></div>
            </div>
        </div>

        <div class="screen" id="screenProfile">
            <div class="glass-card" style="text-align:center;">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div style="font-size:18px; font-weight:600;" id="profileName">Аноним</div>
                <div style="color:var(--text-secondary); font-size:13px;" id="profileId">ID: 0</div>
                <div class="profile-stats">
                    <div class="stat-box"><div class="value" id="statNFT">0</div><div class="label">NFT</div></div>
                    <div class="stat-box"><div class="value" id="statLevel">1</div><div class="label">Уровень</div></div>
                    <div class="stat-box"><div class="value" id="statSpins">0</div><div class="label">Спинов</div></div>
                    <div class="stat-box"><div class="value" id="statUpgrades">0</div><div class="label">Апгрейдов</div></div>
                </div>
            </div>
        </div>

    </div>

    <div class="nav-center">
        <div class="nav-btn active" data-screen="screenInventory">
            <span class="icon">📦</span> ИНВЕНТАРЬ
        </div>
        <div class="nav-btn" data-screen="screenRoulette">
            <span class="icon">🎰</span> РУЛЕТКА
        </div>
        <div class="nav-btn" data-screen="screenUpgrade">
            <span class="icon">🔧</span> АПГРЕЙД
        </div>
    </div>

    <div class="nav-bottom">
        <div class="nav-btn" data-screen="screenProfile">
            <span class="icon">👤</span> ПРОФИЛЬ
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ---------- 1. TELEGRAM SDK ----------
        let tg = null;
        let isTelegram = false;

        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                isTelegram = true;
                console.log('Telegram WebApp инициализирован');
            } else {
                console.warn('Telegram WebApp не обнаружен. Режим эмуляции.');
                tg = {
                    ready: () => {},
                    expand: () => {},
                    showAlert: (msg) => alert(msg),
                    sendData: (data) => console.log('Telegram sendData:', data),
                    initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
                };
            }
        } catch (e) {
            console.error('Ошибка инициализации Telegram:', e);
            tg = {
                ready: () => {},
                expand: () => {},
                showAlert: (msg) => alert(msg),
                sendData: (data) => console.log('Telegram sendData:', data),
                initDataUnsafe: { user: { id: 12345, first_name: 'Тестер' } }
            };
        }

        // ---------- 2. ПОЛУЧЕНИЕ USER_ID ----------
        const USER_ID = tg.initDataUnsafe?.user?.id || 12345;

        // ---------- 3. СПИСОК ПОДАРКОВ (GIF) ----------
        const BASE_URL = 'https://judepip.github.io/NFT-LAB';
        const GIFTS = [
            { name: 'Bow Tie', rarity: 'редкий', image: BASE_URL + '/images/BowTie.gif' },
            { name: 'Chill Flame', rarity: 'эпик', image: BASE_URL + '/images/ChillFlame.gif' },
            { name: 'Big Year', rarity: 'легенд', image: BASE_URL + '/images/BigYear.gif' },
            { name: 'JACK IN THE BOX', rarity: 'обычный', image: BASE_URL + '/images/JackInTheBox.gif' },
            { name: 'Liberty Figure', rarity: 'легенд', image: BASE_URL + '/images/LibertyFigure.gif' },
            { name: 'Light Sword', rarity: 'эпик', image: BASE_URL + '/images/LightSword.gif' },
            { name: 'Star Notepad', rarity: 'редкий', image: BASE_URL + '/images/StarNotepad.gif' },
            { name: 'Кубок', rarity: 'легенд', image: BASE_URL + '/images/Кубок.gif' },
            { name: 'Кольцо', rarity: 'эпик', image: BASE_URL + '/images/Кольцо.gif' },
            { name: 'Мишка', rarity: 'обычный', image: BASE_URL + '/images/Мишка.gif' },
        ];

        // ---------- 4. СОСТОЯНИЕ ----------
        const STORAGE_KEY = 'lab_nft_state';
        const VERSION_KEY = 'lab_nft_version';

        function getDefaultState() {
            return {
                inventory: [],
                balance: 1000.0,
                spins: 0,
                upgrades: [
                    { id: 'up1', level: 0 },
                    { id: 'up2', level: 0 },
                    { id: 'up3', level: 0 }
                ],
                isSpinning: false,
            };
        }

        let state;
        const currentVersion = '2.6';
        const savedVersion = localStorage.getItem(VERSION_KEY);

        try {
            if (savedVersion !== currentVersion) {
                console.log('Обнаружена новая версия. Сброс старых данных...');
                localStorage.removeItem(STORAGE_KEY);
                localStorage.setItem(VERSION_KEY, currentVersion);
                state = getDefaultState();
            } else {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.inventory && parsed.inventory.length > 0) {
                        const firstItem = parsed.inventory[0];
                        if (firstItem && firstItem.name && 
                            (firstItem.name.includes('Кристалл') || 
                             firstItem.name.includes('Теневой') ||
                             firstItem.name.includes('Голограмма'))) {
                            console.log('Обнаружены старые подарки. Сброс инвентаря...');
                            parsed.inventory = [];
                        }
                    }
                    state = parsed;
                    console.log('Состояние загружено из localStorage');
                } else {
                    state = getDefaultState();
                    console.log('Создано новое состояние');
                }
            }
        } catch (e) {
            console.warn('Ошибка загрузки состояния:', e);
            state = getDefaultState();
        }

        if (state.inventory && state.inventory.length > 0) {
            const hasOldGifts = state.inventory.some(item => 
                item.name && (
                    item.name.includes('Кристалл') ||
                    item.name.includes('Теневой') ||
                    item.name.includes('Голограмма') ||
                    item.name.includes('Нейро-куб') ||
                    item.name.includes('Плазменный') ||
                    item.name.includes('Квантовый')
                )
            );
            if (hasOldGifts) {
                console.log('Удалены старые подарки из инвентаря');
                state.inventory = [];
                saveState();
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Ошибка сохранения состояния:', e);
            }
        }

        // ---------- 5. DOM-ССЫЛКИ ----------
        const $ = (id) => document.getElementById(id);
        const balanceDisplay = $('balanceDisplay');
        const nftCount = $('nftCount');
        const screens = document.querySelectorAll('.screen');
        const navBtns = document.querySelectorAll('.nav-btn');
        const inventoryGrid = $('inventoryGrid');
        const upgradeList = $('upgradeList');
        const rouletteSlider = $('rouletteSlider');
        const spinBtn = $('spinBtn');
        const rouletteResult = $('rouletteResult');
        const profileName = $('profileName');
        const profileId = $('profileId');
        const statNFT = $('statNFT');
        const statLevel = $('statLevel');
        const statSpins = $('statSpins');
        const statUpgrades = $('statUpgrades');

        // ---------- 6. ФУНКЦИЯ ОБНОВЛЕНИЯ UI ----------
        function render() {
            balanceDisplay.textContent = state.balance.toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            nftCount.textContent = state.inventory.length + ' шт.';

            if (state.inventory.length === 0) {
                inventoryGrid.innerHTML = `<div class="empty-inventory">🧪 Нет подарков. Крутите рулетку!</div>`;
            } else {
                inventoryGrid.innerHTML = state.inventory.map(item => {
                    const iconHtml = item.image 
                        ? `<img class="nft-image" src="${item.image}" alt="${item.name}" loading="lazy" 
                             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                           <div class="nft-icon" style="display:none;">🎁</div>`
                        : `<div class="nft-icon">🎁</div>`;
                    return `
                        <div class="nft-item" data-id="${item.id}">
                            <div class="glow-pulse"></div>
                            ${iconHtml}
                            <div class="nft-name">${item.name}</div>
                            <div class="nft-rarity">${item.rarity || 'обычный'}</div>
                        </div>
                    `;
                }).join('');
            }

            const upgradeDefs = [
                { id: 'up1', name: 'Генератор GIFT', desc: '+5 GIFT/час', maxLvl: 5, baseCost: 150 },
                { id: 'up2', name: 'Сканер редкости', desc: 'Шанс NFT +3%', maxLvl: 4, baseCost: 200 },
                { id: 'up3', name: 'Ускоритель спина', desc: 'Спин стоит -2 GIFT', maxLvl: 6, baseCost: 100 },
            ];

            upgradeList.innerHTML = upgradeDefs.map(u => {
                const current = state.upgrades.find(up => up.id === u.id) || { level: 0 };
                const level = current.level || 0;
                const isMax = level >= u.maxLvl;
                const cost = u.baseCost * (level + 1);
                const canAfford = state.balance >= cost && !isMax;
                return `
                    <div class="upgrade-item" data-id="${u.id}">
                        <div class="upgrade-info">
                            <div class="title">${u.name}</div>
                            <div class="desc">${u.desc}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="upgrade-level">Ур.${level}/${u.maxLvl}</span>
                            <span class="upgrade-cost">${isMax ? 'MAX' : cost + ' GIFT'}</span>
                            <button class="upgrade-btn" data-id="${u.id}" ${!canAfford ? 'disabled' : ''}>
                                ${isMax ? '✔' : '↑'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            profileName.textContent = tg.initDataUnsafe?.user?.first_name || 'Аноним';
            profileId.textContent = `ID: ${USER_ID}`;
            statNFT.textContent = state.inventory.length;
            statLevel.textContent = 1;
            statSpins.textContent = state.spins;
            statUpgrades.textContent = state.upgrades.filter(u => u.level > 0).length;

            saveState();
        }

        // ---------- 7. СОЗДАНИЕ БЕСКОНЕЧНОЙ ЛЕНТЫ РУЛЕТКИ ----------
        function createRouletteCells() {
            const REPEAT_COUNT = 6;
            let cellsHtml = '';
            for (let rep = 0; rep < REPEAT_COUNT; rep++) {
                GIFTS.forEach((cell, index) => {
                    cellsHtml += `
                        <div class="roulette-cell" data-gift-index="${index}">
                            <img src="${cell.image}" alt="${cell.name}" loading="lazy" 
                                 onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                            <div style="font-size:28px; display:none;">🎁</div>
                            <div class="cell-name">${cell.name}</div>
                            <div class="cell-rarity">${cell.rarity}</div>
                        </div>
                    `;
                });
            }
            
            rouletteSlider.innerHTML = cellsHtml;
            
            const startRepeat = 3;
            const startOffset = startRepeat * GIFTS.length * 20;
            rouletteSlider.style.transition = 'none';
            rouletteSlider.style.transform = `translateX(-${startOffset}%)`;
            void rouletteSlider.offsetWidth;
            rouletteSlider.style.transition = '';
        }

        // ---------- 8. НАВИГАЦИЯ ----------
        function switchScreen(screenId) {
            screens.forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');
            navBtns.forEach(btn => {
                const scr = btn.dataset.screen;
                btn.classList.toggle('active', scr === screenId);
            });
        }

        navBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const screenId = this.dataset.screen;
                if (screenId) switchScreen(screenId);
                if (navigator.vibrate) navigator.vibrate(10);
            });
        });

        // ---------- 9. ОТПРАВКА В БОТА ----------
        function sendToBot(data) {
            try {
                if (isTelegram && tg && typeof tg.sendData === 'function') {
                    tg.sendData(JSON.stringify(data));
                } else {
                    console.log('Emulated sendData:', JSON.stringify(data));
                }
            } catch (e) {
                console.warn('sendData error:', e);
            }
        }

        // ---------- 10. ПОДСВЕТКА ВЫИГРЫШНОЙ ЯЧЕЙКИ ----------
        function highlightCell(giftIndex) {
            const cells = document.querySelectorAll(`.roulette-cell[data-gift-index="${giftIndex}"]`);
            const centerX = window.innerWidth / 2;
            let closestCell = null;
            let closestDist = Infinity;
            
            cells.forEach(cell => {
                const rect = cell.getBoundingClientRect();
                const cellCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cellCenter - centerX);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCell = cell;
                }
            });
            
            if (closestCell) {
                closestCell.classList.add('highlight');
            }
        }

        function clearHighlight() {
            document.querySelectorAll('.roulette-cell').forEach(cell => {
                cell.classList.remove('highlight');
            });
        }

        // ---------- 11. ОПРЕДЕЛЕНИЕ ВЫИГРЫША ПО ПОЗИЦИИ ИНДИКАТОРА ----------
        function getGiftUnderIndicator() {
            const cells = document.querySelectorAll('.roulette-cell');
            const centerX = window.innerWidth / 2;
            let closestCell = null;
            let closestDist = Infinity;
            
            cells.forEach(cell => {
                const rect = cell.getBoundingClientRect();
                const cellCenter = rect.left + rect.width / 2;
                const dist = Math.abs(cellCenter - centerX);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCell = cell;
                }
            });
            
            if (closestCell) {
                const giftIndex = parseInt(closestCell.dataset.giftIndex, 10);
                return giftIndex;
            }
            return 0;
        }

        // ---------- 12. КАСТОМНОЕ МОДАЛЬНОЕ ОКНО С GIF ----------
        function showWinModal(gift) {
            // Удаляем старый модал, если есть
            const oldModal = document.querySelector('.modal-overlay');
            if (oldModal) oldModal.remove();

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <img class="modal-gif" src="${gift.image}" alt="${gift.name}" loading="lazy">
                    <div class="modal-title">${gift.name}</div>
                    <div class="modal-rarity">${gift.rarity || 'обычный'}</div>
                    <button class="modal-close-btn">Закрыть</button>
                </div>
            `;

            document.body.appendChild(overlay);

            // Закрытие по кнопке
            const closeBtn = overlay.querySelector('.modal-close-btn');
            closeBtn.addEventListener('click', function() {
                overlay.remove();
            });

            // Закрытие по клику на фон
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
        }

        // ---------- 13. РУЛЕТКА (С КАСТОМНЫМ МОДАЛОМ) ----------
        spinBtn.addEventListener('click', function() {
            if (state.isSpinning) return;
            if (state.balance < 150) {
                rouletteResult.textContent = '❌ Недостаточно GIFT (нужно 150)';
                tg.showAlert('Недостаточно GIFT! Нужно 150');
                return;
            }

            state.isSpinning = true;
            spinBtn.disabled = true;
            rouletteResult.textContent = '🌀 Крутим...';

            // Выбираем случайный подарок
            const winGiftIndex = Math.floor(Math.random() * GIFTS.length);
            const prize = GIFTS[winGiftIndex];

            // ---------- РАСЧЁТ СДВИГА ----------
            clearHighlight();

            const totalUnique = GIFTS.length;
            const repeats = 6;
            const cellWidthPercent = 20;
            
            const targetRepeat = 4;
            const targetCellIndex = targetRepeat * totalUnique + winGiftIndex;
            
            const visibleOffset = 2.5;
            const offsetPercent = targetCellIndex * cellWidthPercent - visibleOffset * cellWidthPercent;

            rouletteSlider.style.transition = 'none';
            void rouletteSlider.offsetWidth;
            
            rouletteSlider.style.transition = 'transform 5s cubic-bezier(0.1, 0.6, 0.2, 1)';
            rouletteSlider.style.transform = `translateX(-${offsetPercent}%)`;

            if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 80]);

            // Через 4.5 секунды определяем выигрыш и показываем модал
            setTimeout(() => {
                const actualWinIndex = getGiftUnderIndicator();
                const actualPrize = GIFTS[actualWinIndex];
                
                state.balance -= 150;
                state.spins += 1;
                const newGift = {
                    id: 'gift_' + Date.now(),
                    name: actualPrize.name,
                    rarity: actualPrize.rarity,
                    image: actualPrize.image,
                };
                state.inventory.push(newGift);
                
                highlightCell(actualWinIndex);
                rouletteResult.textContent = `🎉 Вы выиграли: ${actualPrize.name}! (${actualPrize.rarity})`;
                
                // КАСТОМНОЕ ОКНО С GIF
                showWinModal(actualPrize);
                
                render();
                sendToBot({
                    action: 'roulette_spin',
                    payload: { prize: actualPrize.name, rarity: actualPrize.rarity, balance: state.balance }
                });
            }, 4800);

            setTimeout(() => {
                state.isSpinning = false;
                spinBtn.disabled = false;
            }, 5500);
        });

        // Двойной тап
        spinBtn.addEventListener('dblclick', function(e) {
            e.preventDefault();
            if (!state.isSpinning) {
                spinBtn.click();
                tg.showAlert('⚡ БЫСТРОЕ КРУЧЕНИЕ!');
            }
        });

        // ---------- 14. АПГРЕЙДЫ ----------
        upgradeList.addEventListener('click', function(e) {
            const btn = e.target.closest('.upgrade-btn');
            if (!btn || btn.disabled) return;
            const id = btn.dataset.id;
            
            const upgradeDefs = {
                'up1': { maxLvl: 5, baseCost: 150 },
                'up2': { maxLvl: 4, baseCost: 200 },
                'up3': { maxLvl: 6, baseCost: 100 }
            };
            
            const def = upgradeDefs[id];
            if (!def) return;
            
            const current = state.upgrades.find(u => u.id === id);
            if (!current) return;
            
            const level = current.level || 0;
            if (level >= def.maxLvl) return;
            
            const cost = def.baseCost * (level + 1);
            if (state.balance < cost) {
                tg.showAlert('Недостаточно GIFT для апгрейда!');
                return;
            }
            
            state.balance -= cost;
            current.level += 1;
            render();
            tg.showAlert('✅ Улучшение повышено!');
            sendToBot({
                action: 'upgrade',
                payload: { id: id, newLevel: current.level }
            });
        });

        // ---------- 15. КЛИК ПО NFT ----------
        inventoryGrid.addEventListener('click', function(e) {
            const item = e.target.closest('.nft-item');
            if (!item) return;
            const id = item.dataset.id;
            const gift = state.inventory.find(n => n.id === id);
            if (gift) {
                // Показываем тот же модал при клике на NFT в инвентаре
                showWinModal(gift);
                sendToBot({
                    action: 'view_nft',
                    payload: { nftId: gift.id, name: gift.name }
                });
            }
        });

        // ---------- 16. ИНИЦИАЛИЗАЦИЯ ----------
        createRouletteCells();
        render();

        console.log('[LAB NFT] Mini App загружен. User ID:', USER_ID);
        console.log('[LAB NFT] Режим Telegram:', isTelegram);
        console.log('[LAB NFT] Всего подарков:', GIFTS.length);
        console.log('[LAB NFT] Текущий инвентарь:', state.inventory.length, 'подарков');
    })();
</script>
</body>
</html>
