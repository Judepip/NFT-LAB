<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFT LAB · Upgrade</title>
<script>
window.__TG_FALLBACK__ = {
    ready:()=>{}, expand:()=>{}, showAlert:(m)=>alert(m),
    sendData:(d)=>console.log('sendData:', d),
    initDataUnsafe: { user: { id: 0, first_name: 'Аноним', last_name:'', username: null, photo_url: null } }
};
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
    --bg:#0a0e1a;
    --neon:#00ff88; --cyan:#00d4ff;
    --glass:rgba(18,24,43,.75);
    --border:rgba(0,255,136,.15);
    --border2:rgba(255,255,255,.08);
    --text:#e8f0f8; --muted:#8899bb;
    --gold:#ffd700; --red:#ff4466;
    --mono:'JetBrains Mono','Roboto Mono',monospace;
}
html,body{height:100%;overflow:hidden;font-family:var(--mono);background:var(--bg);color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%, rgba(0,255,136,.04), transparent 60%),radial-gradient(circle at 80% 70%, rgba(0,212,255,.04), transparent 60%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:6px 8px;}

.header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 8px;border-bottom:1px solid var(--border);flex-shrink:0;gap:6px;}
.header h1{font-size:14px;background:linear-gradient(135deg,var(--neon),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;flex:1;}
.head-icons{display:flex;gap:4px;align-items:center;}
.head-icon{width:26px;height:26px;background:var(--glass);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:.15s;touch-action:manipulation;color:var(--text);}
.head-icon:active{transform:scale(.9);}
.head-icon.active{background:rgba(0,255,136,.15);border-color:var(--neon);}
.deposit-icon{background:linear-gradient(135deg,var(--neon),#00cc70) !important;color:#0a0e1a !important;font-weight:700;font-size:16px !important;border:none !important;box-shadow:0 0 15px rgba(0,255,136,.4);}
.balance{background:var(--glass);border:1px solid var(--border);border-radius:30px;padding:5px 10px;font-size:11px;color:var(--gold);backdrop-filter:blur(8px);cursor:pointer;transition:.15s;}
.balance:active{transform:scale(.95);}

.content{flex:1;overflow-y:auto;margin:6px 0;padding:2px;min-height:0;}
.content::-webkit-scrollbar{width:3px;}
.content::-webkit-scrollbar-thumb{background:var(--neon);border-radius:10px;}
.screen{display:none;animation:fade .25s ease-out;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.upgrade-top{display:grid;grid-template-columns:1fr 170px 1fr;gap:6px;align-items:stretch;margin-bottom:8px;}
.slot-col{display:flex;flex-direction:column;gap:6px;}
.slot-col:first-child .slot-panel{flex:1;}

.slot-panel{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:8px 4px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;backdrop-filter:blur(8px);transition:.2s;}
.slot-panel.filled{border-color:var(--neon);box-shadow:0 0 16px rgba(0,255,136,.15);}
.slot-panel .slot-label{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;text-align:center;line-height:1.2;}
.slot-panel .slot-empty{font-size:22px;opacity:.3;}
.slot-panel .slot-item{text-align:center;}
.slot-panel .slot-item img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,255,136,.3));}
.slot-panel .slot-item .slot-name{font-size:8px;font-weight:600;margin-top:2px;line-height:1.1;}
.slot-panel .slot-item .slot-price{font-size:8px;color:var(--gold);margin-top:1px;}
.slot-panel .slot-remove{position:absolute;top:3px;right:5px;background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;font-family:var(--mono);}

.quick-chances{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px;}
.qc-btn{background:rgba(0,0,0,.4);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:9px;font-weight:700;padding:7px 2px;cursor:pointer;transition:.15s;text-align:center;letter-spacing:.3px;touch-action:manipulation;}
.qc-btn:active{transform:scale(.94);}
.qc-btn.p5  {border-color:rgba(255,68,102,.4); color:#ff8899;}
.qc-btn.p25 {border-color:rgba(255,170,60,.4); color:#ffbb66;}
.qc-btn.p50 {border-color:rgba(255,215,0,.4); color:var(--gold);}
.qc-btn.p75 {border-color:rgba(0,255,136,.4); color:var(--neon);}

.wheel-wrap{position:relative;width:170px;height:170px;margin:0 auto;display:flex;align-items:center;justify-content:center;align-self:center;}
.wheel-svg{transform:rotate(-90deg);}
.wheel-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:14;}
.wheel-progress{fill:none;stroke:url(#wheelGrad);stroke-width:14;stroke-linecap:butt;transition:stroke-dashoffset .5s ease;}
.wheel-spinner{position:absolute;top:50%;left:50%;width:170px;height:170px;margin:-85px 0 0 -85px;pointer-events:none;transform:rotate(0deg);transition:transform 4s cubic-bezier(.17,.67,.3,1);z-index:5;will-change:transform;}
.wheel-spinner.fast{transition:transform 1s cubic-bezier(.17,.67,.3,1);}
.wheel-spinner .marker{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:20px solid #ffffff;filter:drop-shadow(0 0 8px #00ff88) drop-shadow(0 0 16px #00ff88) drop-shadow(0 0 24px rgba(0,255,136,.6));}
.wheel-spinner .marker-glow{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 15px #00ff88, 0 0 30px #00ff88;}
.wheel-center-text{position:absolute;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--neon),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;z-index:3;letter-spacing:-.5px;}
.wheel-center-sub{position:absolute;top:calc(50% + 20px);font-size:8px;color:var(--muted);letter-spacing:1.5px;z-index:3;font-weight:500;}

.upgrade-btn{width:100%;background:linear-gradient(135deg,var(--neon),#00cc70);color:#0a0e1a;border:none;border-radius:30px;padding:12px;font-weight:700;font-size:14px;font-family:var(--mono);box-shadow:0 0 30px rgba(0,255,136,.35);cursor:pointer;transition:.15s;letter-spacing:1px;touch-action:manipulation;}
.upgrade-btn:active{transform:scale(.97);}
.upgrade-btn:disabled{opacity:.35;pointer-events:none;}
.upgrade-info{text-align:center;font-size:10px;color:var(--muted);margin:6px 0;min-height:14px;}

.bottombar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.inv-section{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:8px;backdrop-filter:blur(8px);min-height:280px;display:flex;flex-direction:column;}
.inv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10px;font-weight:600;}
.inv-header .count{color:var(--muted);font-size:9px;}

.tabs{display:flex;gap:4px;margin-bottom:6px;background:rgba(0,0,0,.25);padding:3px;border-radius:8px;}
.tab{flex:1;text-align:center;padding:5px 4px;font-size:9px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:6px;transition:.15s;letter-spacing:.3px;border:1px solid transparent;touch-action:manipulation;}
.tab.active{background:rgba(0,255,136,.1);color:var(--neon);border-color:rgba(0,255,136,.3);}
.tab:active{transform:scale(.96);}

.search-bar{display:grid;grid-template-columns: 1fr auto auto;gap:4px;margin-bottom:6px;}
.search-inputs{display:grid;grid-template-columns: 1.2fr 1px 1fr 1px 1fr;gap:0;background:rgba(0,0,0,.25);border:1px solid var(--border2);border-radius:6px;overflow:hidden;}
.search-inputs input{background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:10px;padding:6px 6px;outline:none;width:100%;min-width:0;}
.search-inputs input::placeholder{color:var(--muted);font-size:9px;}
.search-inputs .divider{background:var(--border2);}
.search-inputs .field{display:flex;align-items:center;position:relative;}
.search-inputs .field .lbl{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:8px;color:var(--gold);font-weight:700;pointer-events:none;}
.search-inputs .field.with-lbl input{padding-left:20px;}

.search-btn, .sort-btn{background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:0 9px;cursor:pointer;transition:.15s;touch-action:manipulation;}
.search-btn:active, .sort-btn:active{transform:scale(.95);background:rgba(0,255,136,.15);}
.sort-btn{font-size:11px;padding:0 7px;}

.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;overflow-y:auto;flex:1;padding-right:2px;align-content:start;}
.inv-grid::-webkit-scrollbar{width:2px;}
.inv-grid::-webkit-scrollbar-thumb{background:var(--neon);border-radius:10px;}
.inv-item{aspect-ratio:1/1;background:radial-gradient(circle at 30% 30%,#1a2a4a,#0d1428);border:1px solid rgba(0,255,136,.2);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
.inv-item.selected{border-color:var(--neon);box-shadow:0 0 12px rgba(0,255,136,.5);background:radial-gradient(circle at 30% 30%,#1e3a5a,#0f1e3a);}
.inv-item:active{transform:scale(.94);}
.inv-item img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(0,255,136,.3));}
.inv-item .inv-name{font-size:6px;text-align:center;color:var(--text);margin-top:1px;line-height:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%;}
.inv-item .inv-price{font-size:6px;color:var(--gold);font-weight:600;margin-top:1px;}
.inv-empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:10px;grid-column:1/-1;}
.inv-item .buy-badge{position:absolute;top:2px;right:2px;background:var(--gold);color:#0a0e1a;font-size:6px;font-weight:700;padding:1px 3px;border-radius:4px;z-index:2;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .3s;overflow-y:auto;}
.modal-content{background:radial-gradient(circle at 30% 30%,#1a2a4a,#0d1428);border:2px solid var(--neon);border-radius:20px;padding:22px 18px;max-width:340px;width:100%;text-align:center;position:relative;}
.modal-content.win{border-color:var(--neon);box-shadow:0 0 60px rgba(0,255,136,.3);}
.modal-content.lose{border-color:var(--red);box-shadow:0 0 60px rgba(255,68,102,.3);}
.modal-content.buy{border-color:var(--gold);box-shadow:0 0 60px rgba(255,215,0,.3);}
.modal-content.sell{border-color:var(--cyan);box-shadow:0 0 60px rgba(0,212,255,.3);}
.modal-content.settings{border-color:var(--border);border-radius:20px;background:#131a2c;max-width:420px;text-align:left;padding:20px;}
.modal-content img{width:100px;height:100px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,255,136,.4));}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;}
.modal-btn{background:var(--neon);color:#0a0e1a;border:none;border-radius:30px;padding:11px 20px;font-weight:700;font-size:13px;font-family:var(--mono);cursor:pointer;flex:1;touch-action:manipulation;}
.modal-btn:active{transform:scale(.96);}
.modal-btn.gold{background:var(--gold);}
.modal-btn.cyan{background:var(--cyan);}
.modal-btn.grey{background:rgba(255,255,255,.1);color:var(--text);}

.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.settings-header h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;}
.settings-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;font-family:var(--mono);}
.settings-section{margin-bottom:18px;}
.settings-section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.settings-section-title h3{font-size:13px;font-weight:700;}
.settings-section-title .default-label{color:var(--gold);font-size:10px;font-weight:600;}
.settings-desc{color:var(--muted);font-size:10px;line-height:1.5;margin-bottom:8px;}

.preset-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.preset-card{background:#0f1525;border:1px solid var(--border2);border-radius:10px;padding:10px 8px;}
.preset-card h4{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:8px;line-height:1.3;}
.preset-buttons{display:flex;gap:5px;align-items:center;}
.preset-btn{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:6px;padding:6px 3px;color:var(--text);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;touch-action:manipulation;min-width:0;}
.preset-btn:active{transform:scale(.94);}
.preset-reset{background:none;border:none;color:var(--gold);font-size:14px;cursor:pointer;padding:2px 4px;font-family:var(--mono);}

.radio-option{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer;touch-action:manipulation;}
.radio-option .radio-circle{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;margin-top:2px;position:relative;transition:.15s;}
.radio-option.active .radio-circle{border-color:var(--gold);}
.radio-option.active .radio-circle::after{content:'';position:absolute;inset:2px;background:var(--gold);border-radius:50%;}
.radio-option .radio-info{flex:1;}
.radio-option .radio-title{font-size:12px;font-weight:700;margin-bottom:2px;}
.radio-option.active .radio-title{color:var(--text);}
.radio-option:not(.active) .radio-title{color:var(--muted);}
.radio-option .radio-desc{font-size:10px;color:var(--muted);line-height:1.4;}

.settings-save{width:100%;background:var(--gold);color:#0a0e1a;border:none;border-radius:24px;padding:12px;font-weight:700;font-size:13px;font-family:var(--mono);cursor:pointer;margin-top:6px;touch-action:manipulation;}
.settings-save:active{transform:scale(.97);}

.volume-slider-wrap{padding:8px 0;}
.volume-slider{width:100%;-webkit-appearance:none;height:6px;background:rgba(255,255,255,.1);border-radius:3px;outline:none;}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 12px rgba(255,215,0,.5);}
.volume-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);cursor:pointer;border:none;box-shadow:0 0 12px rgba(255,215,0,.5);}
.volume-value{text-align:center;font-size:16px;font-weight:700;color:var(--gold);margin:8px 0;}
.volume-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
.volume-test-btn{background:rgba(0,255,136,.15);border:1px solid rgba(0,255,136,.4);color:var(--neon);border-radius:20px;padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;margin-top:12px;width:100%;touch-action:manipulation;}
.volume-test-btn:active{transform:scale(.96);}

/* ПОПОЛНЕНИЕ */
.deposit-tabs{display:flex;gap:4px;margin-bottom:14px;background:rgba(0,0,0,.3);padding:3px;border-radius:10px;}
.deposit-tab{flex:1;text-align:center;padding:9px 4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:8px;transition:.15s;border:1px solid transparent;touch-action:manipulation;}
.deposit-tab.active{background:rgba(0,255,136,.12);color:var(--neon);border-color:rgba(0,255,136,.3);}
.deposit-tab:active{transform:scale(.96);}

.deposit-packages{display:flex;flex-direction:column;gap:8px;}
.deposit-pkg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#0f1525;border:1px solid var(--border2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s;touch-action:manipulation;}
.deposit-pkg:hover{border-color:rgba(0,255,136,.4);}
.deposit-pkg:active{transform:scale(.98);}
.deposit-pkg .pkg-stars{font-size:14px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:4px;}
.deposit-pkg .pkg-ton{font-size:12px;color:var(--cyan);font-weight:600;text-align:right;}
.deposit-pkg .pkg-arrow{font-size:16px;color:var(--muted);}

.deposit-note{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);border-radius:10px;padding:12px;font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px;}
.deposit-note b{color:var(--cyan);}

.deposit-wallet{background:rgba(0,0,0,.35);border:1px dashed var(--border2);border-radius:10px;padding:12px;font-size:10px;color:var(--muted);word-break:break-all;text-align:center;margin:12px 0;line-height:1.5;}
.deposit-wallet .wallet-addr{color:var(--neon);font-weight:600;font-size:11px;margin-top:6px;display:block;}
.deposit-copy{background:rgba(0,255,136,.15);border:1px solid rgba(0,255,136,.4);color:var(--neon);border-radius:20px;padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;margin-top:8px;width:100%;touch-action:manipulation;}
.deposit-copy:active{transform:scale(.96);}

.history-item{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.3);border-radius:10px;padding:8px;margin-bottom:6px;border-left:3px solid var(--muted);}
.history-item.win{border-left-color:var(--neon);}
.history-item.lose{border-left-color:var(--red);}
.history-item img{width:36px;height:36px;object-fit:contain;}
.history-info .h-title{font-size:11px;font-weight:600;line-height:1.2;}
.history-info .h-sub{font-size:9px;color:var(--muted);margin-top:2px;}
.history-meta{text-align:right;}
.history-meta .h-chance{font-size:10px;font-weight:700;color:var(--gold);}
.history-meta .h-time{font-size:8px;color:var(--muted);margin-top:2px;}
.history-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:11px;}

.nav-center{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0;padding:2px 0;}
.nav-btn{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:8px 4px;color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:500;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s;touch-action:manipulation;}
.nav-btn .icon{font-size:16px;}
.nav-btn.active{border-color:var(--neon);color:var(--neon);background:rgba(0,255,136,.05);box-shadow:0 0 20px rgba(0,255,136,.1);}
.nav-btn:active{transform:scale(.94);}

.profile-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;overflow:hidden;position:relative;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-size:18px;font-weight:600;margin-bottom:2px;}
.profile-username{color:var(--cyan);font-size:12px;margin-bottom:4px;}
.profile-id{color:var(--muted);font-size:11px;}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.stat-box{background:rgba(0,0,0,.3);border-radius:10px;padding:12px;text-align:center;}
.stat-box .value{font-size:20px;font-weight:600;color:var(--gold);}
.stat-box .label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px;}

@media(max-width:380px){
    .upgrade-top{grid-template-columns:1fr 140px 1fr;gap:4px;}
    .wheel-wrap{width:140px;height:140px;}
    .wheel-spinner{width:140px;height:140px;margin:-70px 0 0 -70px;}
    .wheel-center-text{font-size:20px;}
    .slot-panel{min-height:105px;}
    .slot-panel .slot-item img{width:38px;height:38px;}
    .inv-item img{width:28px;height:28px;}
    .tab{font-size:8px;padding:4px 2px;}
    .qc-btn{font-size:8px;padding:6px 1px;}
    .preset-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">

    <div class="header">
        <h1>⚡ LAB UPGRADER</h1>
        <div class="head-icons">
            <div class="head-icon" id="btnInfo" title="История">📜</div>

<script>
(function(){
'use strict';

// ===== 1) TELEGRAM =====
let tg = null;
let user = { id:0, first_name:'Аноним', last_name:'', username:null, photo_url:null };

function initTelegram(callback){
    let attempts = 0;
    const MAX = 50;
    const check = () => {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined){
            tg = window.Telegram.WebApp;
            try { tg.ready(); tg.expand(); } catch(e){}
            const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (u){
                user = {
                    id: u.id || 0,
                    first_name: u.first_name || 'Аноним',
                    last_name: u.last_name || '',
                    username: u.username || null,
                    photo_url: u.photo_url || null,
                };
            }
            console.log('[TG] init OK', user);
            callback();
        } else if (attempts++ < MAX){
            setTimeout(check, 100);
        } else {
            tg = window.__TG_FALLBACK__;
            console.warn('[TG] SDK не загрузился, эмуляция');
            callback();
        }
    };
    check();
}

// ===== 2) ПРЕДМЕТЫ =====
const BASE = 'https://judepip.github.io/NFT-LAB';
const GIFTS = [
    { name:'Bow Tie',        price:800, image: BASE+'/images/BowTie.gif' },
    { name:'Chill Flame',    price:500, image: BASE+'/images/ChillFlame.gif' },
    { name:'Big Year',       price:500, image: BASE+'/images/BigYear.gif' },
    { name:'JACK IN THE BOX',price:600, image: BASE+'/images/JackInTheBox.gif' },
    { name:'Liberty Figure', price:450, image: BASE+'/images/LibertyFigure.gif' },
    { name:'Light Sword',    price:480, image: BASE+'/images/LightSword.gif' },
    { name:'Star Notepad',   price:480, image: BASE+'/images/StarNotepad.gif' },
    { name:'Кубок',          price:100, image: BASE+'/images/Кубок.gif' },
    { name:'Кольцо',         price:100, image: BASE+'/images/Кольцо.gif' },
    { name:'Мишка',          price:15,  image: BASE+'/images/Мишка.gif' },
];

// ===== 3) СОСТОЯНИЕ =====
const KEY = 'lab_upgrade_v12';
function defaultState(){
    return {
        inventory: [],
        balance: 0,
        selectedLeft: null,
        selectedRight: null,
        isUpgrading: false,
        rightTab: 'shop',
        search: { name:'', min:'', max:'' },
        sortAsc: true,
        history: [],
        settings: {
            presets: { x: [2, 4, 8], percent: [5, 25, 50, 75] },
            soundOn: true,
            volume: 0.7,
            fastSpin: false,
        },
    };
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }
catch(e){ state = defaultState(); }
if (!state.rightTab) state.rightTab = 'shop';
if (!state.search) state.search = { name:'', min:'', max:'' };
if (typeof state.sortAsc !== 'boolean') state.sortAsc = true;
if (!state.history) state.history = [];
if (!state.settings) state.settings = { presets:{x:[2,4,8],percent:[5,25,50,75]}, soundOn:true, volume:0.7, fastSpin:false };
if (!state.settings.presets) state.settings.presets = { x:[2,4,8], percent:[5,25,50,75] };
if (state.settings.presets.percent.length !== 4) state.settings.presets.percent = [5,25,50,75];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

// ===== 4) ЗВУКИ =====
let audioCtx = null;
function getAudioCtx(){
    if (!audioCtx){
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e){ return null; }
    }
    return audioCtx;
}
function playNote(freq, startTime, duration, type='sine', volumeMul=1){
    if (!state.settings.soundOn) return;
    if (state.settings.volume <= 0) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime + startTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const vol = state.settings.volume * volumeMul * 0.18;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + duration * 0.1);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
}
const Sound = {
    click(){ playNote(1200, 0, 0.08, 'sine', 0.9); playNote(1800, 0.005, 0.06, 'sine', 0.4); },
    tick(){ playNote(700 + Math.random() * 300, 0, 0.06, 'triangle', 0.5); },
    win(){
        [523.25, 659.25, 783.99, 1046.50].forEach((f,i) => {
            playNote(f, i*0.11, 0.45, 'sine', 1);
            playNote(f*2, i*0.11 + 0.01, 0.3, 'sine', 0.25);
        });
        playNote(523.25, 0.5, 0.7, 'sine', 0.5);
        playNote(659.25, 0.5, 0.7, 'sine', 0.4);
        playNote(783.99, 0.5, 0.7, 'sine', 0.4);
    },
    lose(){
        [440, 392, 329.63, 261.63].forEach((f,i) => playNote(f, i*0.13, 0.35, 'sine', 0.85));
        playNote(196, 0.55, 0.6, 'sine', 0.5);
    },
    buy(){ playNote(659.25, 0, 0.15, 'sine', 0.9); playNote(987.77, 0.08, 0.25, 'sine', 0.8); },
    sell(){ playNote(987.77, 0, 0.15, 'sine', 0.9); playNote(659.25, 0.08, 0.25, 'sine', 0.8); },
};
let spinSoundInterval = null;
function startSpinSound(){ stopSpinSound(); spinSoundInterval = setInterval(() => Sound.tick(), 90); }
function stopSpinSound(){ if (spinSoundInterval){ clearInterval(spinSoundInterval); spinSoundInterval = null; } }

// ===== 5) DOM =====
const $ = id => document.getElementById(id);
const balanceDisplay = $('balanceDisplay');
const invGrid = $('invGrid');
const rightGrid = $('rightGrid');
const invCount = $('invCount');
const slotLeft = $('slotLeft');
const slotRight = $('slotRight');
const chanceText = $('chanceText');
const wheelProgress = $('wheelProgress');
const wheelSpinner = $('wheelSpinner');
const upgradeBtn = $('upgradeBtn');
const upgradeInfo = $('upgradeInfo');
const screens = document.querySelectorAll('.screen');
const navBtns = document.querySelectorAll('.nav-btn');
const tabs = document.querySelectorAll('.tab');
const searchName = $('searchName');
const priceMin = $('priceMin');
const priceMax = $('priceMax');
const searchBtn = $('searchBtn');
const sortBtn = $('sortBtn');

// ===== 6) БЫСТРЫЕ КНОПКИ =====
function renderQuickButtons(){
    const container = document.getElementById('quickRight');
    if (!container) return;
    const percentPresets = state.settings.presets.percent;
    container.innerHTML = percentPresets.map(pct => {
        let colorClass = 'p50';
        if (pct <= 15) colorClass = 'p5';
        else if (pct <= 40) colorClass = 'p25';
        else if (pct <= 65) colorClass = 'p50';
        else colorClass = 'p75';
        return `<button class="qc-btn ${colorClass}" data-chance="${pct}">${pct}%</button>`;
    }).join('');
    container.querySelectorAll('.qc-btn').forEach(btn => {
        btn.addEventListener('click', function(){
            quickPickChance(Number(this.dataset.chance));
        });
    });
}

// ===== 7) ПРОФИЛЬ =====
function renderProfile(){
    const fullName = (user.first_name + ' ' + (user.last_name || '')).trim() || 'Аноним';
    $('profileName').textContent = fullName;
    const uEl = $('profileUsername');
    if (user.username){ uEl.textContent = '@' + user.username; uEl.style.display='block'; }
    else { uEl.textContent = ''; uEl.style.display='none'; }
    $('profileId').textContent = 'ID: ' + (user.id || '—');
    const avEl = $('profileAvatar');
    if (user.photo_url){ avEl.innerHTML = '<img src="'+user.photo_url+'" onerror="this.parentNode.innerHTML=\'👤\'">'; }
    else { avEl.innerHTML = '👤'; }
    $('statNFT').textContent = state.inventory.length;
    $('statBalance').textContent = Math.floor(state.balance) + ' ⭐';
}

// ===== 8) ИСТОРИЯ =====
function renderHistory(){
    const list = $('historyList');
    $('historyCount').textContent = state.history.length;
    if (state.history.length === 0){
        list.innerHTML = '<div class="history-empty">Пока нет записей<br><span style="font-size:10px;">Сделайте апгрейд чтобы увидеть историю</span></div>';
        return;
    }
    list.innerHTML = state.history.slice(0, 50).map(h => `
        <div class="history-item ${h.success?'win':'lose'}">
            <img src="${h.image}" onerror="this.style.display='none'">
            <div class="history-info">
                <div class="h-title">${h.success?'✅ '+h.to:'❌ '+h.from}</div>
                <div class="h-sub">${h.success?('из '+h.from):('было: '+h.from+' → '+h.to)}</div>
            </div>
            <div class="history-meta">
                <div class="h-chance">${h.chance.toFixed(1)}%</div>
                <div class="h-time">${h.time}</div>
            </div>
        </div>
    `).join('');
}
function addHistory(entry){
    state.history.unshift(entry);
    if (state.history.length > 100) state.history.length = 100;
    save();
}

// ===== 9) ФИЛЬТРАЦИЯ =====
function filterGifts(list){
    const q = (state.search.name || '').toLowerCase().trim();
    const min = state.search.min !== '' ? Number(state.search.min) : null;
    const max = state.search.max !== '' ? Number(state.search.max) : null;
    let filtered = list.filter(g => {
        if (q && !g.name.toLowerCase().includes(q)) return false;
        if (min !== null && g.price < min) return false;
        if (max !== null && g.price > max) return false;
        return true;
    });
    filtered.sort((a,b) => state.sortAsc ? a.price - b.price : b.price - a.price);
    return filtered;
}

// ===== 10) РЕНДЕР =====
function render(){
    balanceDisplay.textContent = Math.floor(state.balance);
    invCount.textContent = state.inventory.length + ' шт.';

    if (state.inventory.length === 0){
        invGrid.innerHTML = `
            <div class="inv-empty" style="padding:30px 12px;">
                <div style="font-size:32px;margin-bottom:8px;">💎</div>
                <div style="font-size:12px;color:var(--text);margin-bottom:4px;font-weight:600;">Нет предметов</div>
                <div style="font-size:10px;color:var(--muted);margin-bottom:14px;">Пополните баланс и купите первый подарок</div>
                <button class="volume-test-btn" id="emptyDepositBtn" style="max-width:200px;margin:0 auto;background:linear-gradient(135deg,var(--neon),#00cc70);color:#0a0e1a;border:none;">
                    ＋ ПОПОЛНИТЬ ОТ 100 ⭐
                </button>
            </div>`;
        setTimeout(() => {
            const b = document.getElementById('emptyDepositBtn');
            if (b) b.addEventListener('click', () => { Sound.click(); showDepositModal('ton'); });
        }, 0);
    } else {
        invGrid.innerHTML = state.inventory.map(it => `
            <div class="inv-item ${state.selectedLeft===it.id?'selected':''}" data-id="${it.id}">
                <img src="${it.image}" onerror="this.style.display='none'">
                <div class="inv-name">${it.name}</div>
                <div class="inv-price">⭐${it.price}</div>
            </div>`).join('');
    }

    const filtered = filterGifts(GIFTS);
    if (state.rightTab === 'shop'){
        if (filtered.length === 0){
            rightGrid.innerHTML = '<div class="inv-empty">Ничего не найдено</div>';
        } else {
            rightGrid.innerHTML = filtered.map(g => {
                const idx = GIFTS.indexOf(g);
                return `
                <div class="inv-item" data-buy="${idx}">
                    <div class="buy-badge">КУПИТЬ</div>
                    <img src="${g.image}" onerror="this.style.display='none'">
                    <div class="inv-name">${g.name}</div>
                    <div class="inv-price">⭐${g.price}</div>
                </div>`;
            }).join('');
        }
    } else {
        if (filtered.length === 0){
            rightGrid.innerHTML = '<div class="inv-empty">Ничего не найдено</div>';
        } else {
            rightGrid.innerHTML = filtered.map(g => {
                const idx = GIFTS.indexOf(g);
                return `
                <div class="inv-item ${state.selectedRight===idx?'selected':''}" data-target="${idx}">
                    <img src="${g.image}" onerror="this.style.display='none'">
                    <div class="inv-name">${g.name}</div>
                    <div class="inv-price">⭐${g.price}</div>
                </div>`;
            }).join('');
        }
    }

    const leftItem = state.inventory.find(x => x.id === state.selectedLeft);
    if (leftItem){
        slotLeft.classList.add('filled');
        slotLeft.innerHTML = `
            <button class="slot-remove" onclick="removeLeft()">✕</button>
            <div class="slot-item">
                <img src="${leftItem.image}">
                <div class="slot-name">${leftItem.name}</div>
                <div class="slot-price">⭐${leftItem.price}</div>
            </div>`;
    } else {
        slotLeft.classList.remove('filled');
        slotLeft.innerHTML = `<div class="slot-label">ВЫБЕРИТЕ ПРЕДМЕТ</div><div class="slot-empty">➕</div>`;
    }

    const rightItem = state.selectedRight !== null ? GIFTS[state.selectedRight] : null;
    if (rightItem){
        slotRight.classList.add('filled');
        slotRight.innerHTML = `
            <button class="slot-remove" onclick="removeRight()">✕</button>
            <div class="slot-item">
                <img src="${rightItem.image}">
                <div class="slot-name">${rightItem.name}</div>
                <div class="slot-price">⭐${rightItem.price}</div>
            </div>`;
    } else {
        slotRight.classList.remove('filled');
        slotRight.innerHTML = `<div class="slot-label">ВЫБЕРИТЕ ЦЕЛЬ</div><div class="slot-empty">🎯</div>`;
    }

    if (document.activeElement !== searchName) searchName.value = state.search.name || '';
    if (document.activeElement !== priceMin)   priceMin.value   = state.search.min  || '';
    if (document.activeElement !== priceMax)   priceMax.value   = state.search.max  || '';

    updateChance();
    renderProfile();
    save();
}

// ===== 11) ШАНС =====
const MAX_CHANCE = 75;
function calcChance(){
    const left = state.inventory.find(x => x.id === state.selectedLeft);
    const right = state.selectedRight !== null ? GIFTS[state.selectedRight] : null;
    if (!left || !right) return 0;
    return Math.min(MAX_CHANCE, Math.max(1, (left.price / right.price) * 100));
}
function updateChance(){
    const chance = calcChance();
    chanceText.textContent = chance.toFixed(1) + '%';
    const CIRC = 439.82;
    wheelProgress.setAttribute('stroke-dasharray', CIRC);
    wheelProgress.setAttribute('stroke-dashoffset', CIRC - (CIRC * chance / 100));

    const left = state.inventory.find(x => x.id === state.selectedLeft);
    const right = state.selectedRight !== null ? GIFTS[state.selectedRight] : null;

    if (!left || !right){
        upgradeBtn.disabled = true;
        upgradeInfo.textContent = 'Выберите предмет и цель';
    } else if (left.price >= right.price){
        upgradeBtn.disabled = true;
        upgradeInfo.textContent = '⚠️ Цель должна быть дороже';
    } else {
        upgradeBtn.disabled = false;
        upgradeInfo.textContent = `Шанс: ${chance.toFixed(1)}% · макс ${MAX_CHANCE}%`;
    }
}

// ===== 12) БЫСТРЫЙ ПОДБОР =====
function quickPickChance(targetPercent){
    let basePrice = null;
    const leftItem = state.inventory.find(x => x.id === state.selectedLeft);
    const rightItem = state.selectedRight !== null ? GIFTS[state.selectedRight] : null;

    if (leftItem){
        basePrice = leftItem.price;
    } else if (rightItem){
        basePrice = rightItem.price;
    } else {
        tg.showAlert('Сначала выберите предмет слева или цель справа');
        return;
    }
    const wantedPrice = basePrice * 100 / targetPercent;
    let bestIdx = 0, bestDiff = Infinity;
    GIFTS.forEach((g, i) => {
        const diff = Math.abs(g.price - wantedPrice);
        if (diff < bestDiff){ bestDiff = diff; bestIdx = i; }
    });

    if (leftItem){
        state.selectedRight = bestIdx;
        state.rightTab = 'target';
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === 'target');
        });
    } else {
        const wantedLeftPrice = rightItem.price * targetPercent / 100;
        let bestInv = null, bestInvDiff = Infinity;
        state.inventory.forEach(it => {
            const d = Math.abs(it.price - wantedLeftPrice);
            if (d < bestInvDiff){ bestInvDiff = d; bestInv = it; }
        });
        if (bestInv){ state.selectedLeft = bestInv.id; }
        else { tg.showAlert('Нет подходящего предмета'); return; }
    }
    Sound.click();
    render();
    if (navigator.vibrate) navigator.vibrate(15);
}

// ===== 13) ПОИСК =====
function applySearch(){
    state.search.name = searchName.value.trim();
    state.search.min  = priceMin.value.trim();
    state.search.max  = priceMax.value.trim();
    render();
}
searchBtn.addEventListener('click', () => { Sound.click(); applySearch(); });
searchName.addEventListener('input', applySearch);
priceMin.addEventListener('input', applySearch);
priceMax.addEventListener('input', applySearch);

// ===== 14) СОРТИРОВКА =====
sortBtn.addEventListener('click', () => {
    Sound.click();
    state.sortAsc = !state.sortAsc;
    sortBtn.textContent = state.sortAsc ? '▲' : '▼';
    render();
});
sortBtn.textContent = state.sortAsc ? '▲' : '▼';

// ===== 15) ТАБЫ =====
tabs.forEach(tab => {
    tab.addEventListener('click', function(){
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        state.rightTab = this.dataset.tab;
        Sound.click();
        render();
        if (navigator.vibrate) navigator.vibrate(8);
    });
});

function showSellModal(itemId){
    const item = state.inventory.find(x => x.id === itemId);
    if (!item) return;
    const old = document.querySelector('.modal-overlay');
    if (old) old.remove();
    const overlay = document.createElement('div');

    overlay.innerHTML = `

    overlay.querySelector('[data-action="sell"]').addEventListener('click', () => {

        overlay.remove();
        render();
        tg.showAlert('✅ Продано: ' + item.name + ' за ⭐' + item.price);
        try { tg.sendData(JSON.stringify({ action:'sell_gift', payload:{name:item.name,price:item.price,balance:state.balance,userId:user.id} })); } catch(e){}
        if (navigator.vibrate) navigator.vibrate([20,40,20]);
    });
}

// ===== 19) АПГРЕЙД =====
function doUpgrade(){
    if (state.isUpgrading) return;
    const left = state.inventory.find(x => x.id === state.selectedLeft);
    const right = state.selectedRight !== null ? GIFTS[state.selectedRight] : null;
    if (!left || !right) return;

    const chance = calcChance();
    state.isUpgrading = true;
    upgradeBtn.disabled = true;
    upgradeInfo.textContent = state.settings.fastSpin ? '⚡ Быстрая прокачка...' : '🌀 Прокачка...';
    if (navigator.vibrate) navigator.vibrate([30,60,30]);

    const finalAngleDeg = Math.random() * 360;
    const chanceDeg = chance * 3.6;
    const success = finalAngleDeg < chanceDeg;

    const turns = 4 + Math.floor(Math.random() * 3);
    const finalRotation = turns * 360 + finalAngleDeg;
    const duration = state.settings.fastSpin ? 1 : 4;

    wheelSpinner.style.transition = 'none';
    wheelSpinner.style.transform = 'rotate(0deg)';
    void wheelSpinner.offsetWidth;
    wheelSpinner.style.transition = `transform ${duration}s cubic-bezier(.17,.67,.3,1)`;
    wheelSpinner.style.transform = `rotate(${finalRotation}deg)`;

    startSpinSound();

    setTimeout(() => {
        stopSpinSound();
        state.inventory = state.inventory.filter(x => x.id !== left.id);
        if (success){
            state.inventory.push({
                id: 'gift_' + Date.now(),
                name: right.name, price: right.price, image: right.image,
            });
        }
        state.selectedLeft = null;
        state.isUpgrading = false;
        upgradeInfo.textContent = success ? '✅ Успех!' : '❌ Неудача';

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
        addHistory({
            from: left.name, to: right.name,
            success, chance, time: timeStr,
            image: success ? right.image : left.image,
        });

        if (success) Sound.win(); else Sound.lose();

        render();
        renderHistory();
        showResult(success, success ? right : left, chance);

        try { tg.sendData(JSON.stringify({ action:'upgrade', payload:{from:left.name,to:right.name,chance,success,userId:user.id} })); } catch(e){}
    }, duration*1000 + 100);
}

upgradeBtn.addEventListener('click', () => {
    Sound.click();
    doUpgrade();
});

            const payBtn = overlay.querySelector('#payBtn');
            if (payBtn){
                payBtn.addEventListener('click', async () => {
                    if (!tonConnectUI || !tonConnectUI.connected || !selectedAmount) return;

                    const btn = payBtn;
                    const info = overlay.querySelector('#payInfo');
                    btn.disabled = true;
                    btn.textContent = 'ОЖИДАНИЕ...';
                    info.textContent = 'Откройте кошелёк и подтвердите';

                    const amountNano = Math.floor(selectedAmount.ton * 1e9).toString();

                    const transaction = {
                        validUntil: Math.floor(Date.now() / 1000) + 300,
                        network: '-239',
                        messages: [{
                            address: RECIPIENT_ADDRESS,
                            amount: amountNano
                        }]
                    };

                    try {
                        const result = await tonConnectUI.sendTransaction(transaction);
                        console.log('✅ Транзакция:', result.boc);
                        info.textContent = '⏳ Отправлено! Звёзды зачислятся в течение 1-2 мин.';
                        btn.textContent = 'ОТПРАВЛЕНО';

                        try {
                            tg.sendData(JSON.stringify({
                                action: 'topup_request',
                                payload: {
                                    stars: selectedAmount.stars,
                                    ton: selectedAmount.ton,
                                    boc: result.boc,
                                    userId: user.id
                                }
                            }));
                        } catch(e){}

                        setTimeout(() => {
                            overlay.remove();
                        }, 2500);
                    } catch (e){
                        console.error('❌ Ошибка транзакции:', e);
                        info.textContent = '❌ Транзакция отклонена';
                        btn.textContent = 'ОПЛАТИТЬ';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                    }
                });
            }
        } else {
            const botBtn = overlay.querySelector('[data-action="openBot"]');
            if (botBtn){
                botBtn.addEventListener('click', () => {
                    Sound.click();
                    tg.showAlert('Напишите боту @ваш_бот чтобы отправить NFT-подарок');
                });
            }
        }
    }

    renderContent();
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}
/* ===== КОНЕЦ TON CONNECT ===== */

// ===== 24) ВЕРХНИЕ КНОПКИ =====
$('btnInfo').addEventListener('click', () => {
    Sound.click();
    switchScreen('screenHistory');
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.screen === 'screenHistory'));
});
$('btnSettings').addEventListener('click', () => { Sound.click(); showSettingsModal(); });
$('btnVolume').addEventListener('click', () => { Sound.click(); showVolumeModal(); });
$('btnFast').addEventListener('click', function(){
    Sound.click();
    state.settings.fastSpin = !state.settings.fastSpin;
    this.classList.toggle('active', state.settings.fastSpin);
    save();
    tg.showAlert(state.settings.fastSpin ? '⚡ Быстрый прокрут включён' : 'Обычный прокрут');
});
$('btnDeposit').addEventListener('click', () => { Sound.click(); showDepositModal('ton'); });
$('balanceBtn').addEventListener('click', () => { Sound.click(); showDepositModal('ton'); });

function applySettingsToUI(){
    $('btnFast').classList.toggle('active', state.settings.fastSpin);
}

// ===== 25) НАВИГАЦИЯ =====
function switchScreen(id){
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id)?.classList.add('active');
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.screen === id));
    if (id === 'screenProfile') renderProfile();
    if (id === 'screenHistory') renderHistory();
}
navBtns.forEach(b => b.addEventListener('click', function(){
    Sound.click();
    switchScreen(this.dataset.screen);
    if (navigator.vibrate) navigator.vibrate(10);
}));

// ===== 26) СТАРТ =====
initTelegram(function(){
    render();
    renderHistory();
    applySettingsToUI();
    renderQuickButtons();
    initTonConnect();   // ← ДОБАВЛЕНО: инициализация TON Connect
    console.log('[UPGRADER] готов, user:', user);
});
})();
